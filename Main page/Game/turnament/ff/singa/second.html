<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF Match 7 – Tactical Debrief</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a08;--card:#0b1612;--ink:#e6fff3;--mut:#6fa58a;--g:#39ff88;--a:#ffb52e;--r:#ff4d4d;--c:#2ee6d6;--line:#39ff8826;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eaf7f0;--card:#fff;--ink:#0b2a1c;--mut:#4d7a64;--g:#0a9a4a;--a:#c77c00;--r:#d62f2f;--c:#0b8f85;--line:#0a9a4a30}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eaf7f0;--card:#fff;--ink:#0b2a1c;--mut:#4d7a64;--g:#0a9a4a;--a:#c77c00;--r:#d62f2f;--c:#0b8f85;--line:#0a9a4a30}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:38px 38px;mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}
.scan{position:fixed;left:0;right:0;height:120px;z-index:0;pointer-events:none;background:linear-gradient(transparent,var(--line),transparent);animation:sc 6s linear infinite}
@keyframes sc{from{top:-120px}to{top:100%}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:24px 16px 60px}
.hud{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:10px}
.hud b{color:var(--g);animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
h1{font:400 clamp(34px,10vw,64px)/1 Bungee,sans-serif;text-align:center;margin:26px 0 6px;color:var(--g);text-shadow:0 0 20px var(--g);position:relative}
h1::before,h1::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:.7;animation:gl 3s infinite steps(1)}
h1::before{color:var(--r);clip-path:inset(0 0 60% 0);transform:translateX(-2px)}
h1::after{color:var(--c);clip-path:inset(60% 0 0 0);transform:translateX(2px)}
@keyframes gl{0%,90%{transform:none}92%{transform:translateX(5px)}95%{transform:translateX(-5px)}}
.sub{text-align:center;color:var(--mut);letter-spacing:.15em;font-size:14px}
.hero{position:relative;margin:28px auto;width:min(300px,80vw);aspect-ratio:1;display:grid;place-items:center}
.radar{position:absolute;inset:0;border-radius:50%;border:2px solid var(--g);background:repeating-radial-gradient(circle,transparent 0 28px,var(--line) 28px 29px);box-shadow:0 0 30px var(--line),inset 0 0 30px var(--line);overflow:hidden}
.radar::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 300deg,#39ff8877 360deg);animation:rt 3s linear infinite}
@keyframes rt{to{transform:rotate(1turn)}}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--r);box-shadow:0 0 10px var(--r);animation:bl 2s infinite}
.win{position:relative;text-align:center;background:var(--card);border:1px solid var(--g);padding:14px 18px;border-radius:12px;box-shadow:0 0 30px var(--line)}
.win small{font-size:11px;letter-spacing:.3em;color:var(--a)}
.win h2{font:400 34px Bungee,sans-serif;color:var(--ink)}
.win p{color:var(--g);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.sm{border:1px solid var(--line);background:var(--card);padding:12px;text-align:center;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.sm b{display:block;font:400 24px Bungee,sans-serif;color:var(--a)}.sm span{font-size:12px;color:var(--mut);letter-spacing:.15em}
.cards{display:grid;gap:12px}
.pc{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);padding:14px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);opacity:0;transform:translateX(-40px);transition:.6s}
.pc.show{opacity:1;transform:none}
.pc.f{border-color:var(--g)}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}
.ring em{position:absolute;inset:0;display:grid;place-items:center;font:400 26px Bungee,sans-serif;font-style:normal}
.nm{font:700 22px 'Chakra Petch';text-transform:uppercase;letter-spacing:.06em}
.nm i{font-style:normal;font-size:12px;color:var(--mut);margin-left:8px;letter-spacing:.2em}
.mt{display:flex;gap:16px;margin-top:6px;color:var(--mut);font-size:15px}
.mt b{color:var(--ink)}
.sk{margin-top:8px;font-size:20px;letter-spacing:4px;min-height:26px}
.sk.z{font-size:12px;letter-spacing:.2em;color:var(--mut)}
footer{text-align:center;margin-top:30px;color:var(--mut);letter-spacing:.25em;font-size:12px}
</style></head><body>
<div class="grid"></div><div class="scan"></div>
<div class="wrap">
<div class="hud"><span>▮ OP: MATCH-07</span><span><b>●</b> DEBRIEF LIVE</span></div>
<h1 data-t="MATCH DEBRIEF">MATCH DEBRIEF</h1>
<p class="sub">5 OPERATORS · 9 MIN 40 SEC · ZONE CLEARED</p>
<div class="hero"><div class="radar"></div><span class="dot" style="top:28%;left:62%"></span><span class="dot" style="top:60%;left:30%;animation-delay:.7s"></span><span class="dot" style="top:70%;left:68%;animation-delay:1.2s"></span>
<div class="win"><small>★ BOOYAH ★</small><h2>MAHDI</h2><p>9:40 · 3 KILLS</p></div></div>
<div class="sum"><div class="sm"><b>5</b><span>PLAYERS</span></div><div class="sm"><b>9:40</b><span>DURATION</span></div><div class="sm"><b>4</b><span>TOTAL KILLS</span></div></div>
<div class="cards" id="c"></div>
<footer>// END OF TRANSMISSION //</footer>
</div>
<script>
var P=[["mahdi","9:40",3,"var(--g)"],["tamim","9:38",0,"var(--c)"],["saharia","8:20",0,"var(--a)"],["junayed","8:10",1,"var(--a)"],["arman","5:10",0,"var(--r)"]],T=580,H="";
P.forEach(function(p,i){var a=p[1].split(":"),s=a[0]*60+ +a[1],sk=p[2]?"💀".repeat(p[2]):'<span class="z">NO ELIMINATIONS</span>';
H+='<div class="pc'+(i?'':' f')+'"><div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle class="bg" cx="48" cy="48" r="42"/><circle class="fg" cx="48" cy="48" r="42" stroke="'+p[3]+'" data-o="'+(264-264*s/T).toFixed(1)+'"/></svg><em style="color:'+p[3]+'">#'+(i+1)+'</em></div><div><div class="nm">'+p[0]+'<i>'+["1ST","2ND","3RD","4TH","5TH"][i]+'</i></div><div class="mt"><span>SURVIVED <b>'+p[1]+'</b></span><span>KILLS <b>'+p[2]+'</b></span></div><div class="sk'+(p[2]?'':' z')+'">'+sk+'</div></div></div>'});
document.getElementById("c").innerHTML=H;
document.querySelectorAll(".pc").forEach(function(r,i){setTimeout(function(){r.classList.add("show");r.querySelector(".fg").style.strokeDashoffset=r.querySelector(".fg").dataset.o},400+i*250)});
</script></body></html>
