<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF Team Championship – Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b1a;--card:#0d1630;--card2:#111d3f;--ink:#f2f6ff;--mut:#8b9ac4;--gold:#ffcf4a;--cy:#35d8ff;--line:#ffffff17;--skew:-12deg;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef2fb;--card:#fff;--card2:#f1f5ff;--ink:#0d1630;--mut:#5c6a92;--gold:#c98a00;--cy:#0a8fb8;--line:#0d163018}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2fb;--card:#fff;--card2:#f1f5ff;--ink:#0d1630;--mut:#5c6a92;--gold:#c98a00;--cy:#0a8fb8;--line:#0d163018}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-weight:500;min-height:100vh;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:conic-gradient(from 200deg at 50% -10%,transparent 0 20deg,#35d8ff1c 30deg,transparent 40deg 60deg,#ffcf4a22 75deg,transparent 90deg 110deg,#35d8ff18 125deg,transparent 140deg);animation:sw 9s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-6deg) scale(1.1)}to{transform:rotate(6deg) scale(1.1)}}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:24px 14px 56px}
.ban{text-align:center}
.live{display:inline-flex;gap:8px;align-items:center;font:700 13px Oswald;letter-spacing:.3em;color:var(--cy)}
.live i{width:9px;height:9px;border-radius:50%;background:#ff3d57;animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.25}}
h1{font:700 clamp(30px,8vw,58px)/1 Oswald;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
h1 span{background:linear-gradient(90deg,var(--gold),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);letter-spacing:.2em;font:500 14px Oswald;text-transform:uppercase}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}
.s{background:var(--card);border:1px solid var(--line);padding:10px 4px;text-align:center;transform:skewX(var(--skew))}
.s>*{transform:skewX(12deg)}
.s b{display:block;font:700 22px Oswald;color:var(--gold)}.s span{font-size:11px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.champ{position:relative;margin-bottom:22px;padding:22px 16px;text-align:center;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--gold);overflow:hidden;box-shadow:0 0 40px #ffcf4a22}
.champ::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,#ffffff22,transparent);transform:skewX(-20deg);animation:gl 3.5s infinite}
@keyframes gl{to{left:120%}}
.champ small{font:700 13px Oswald;letter-spacing:.4em;color:var(--gold)}
.champ h2{font:700 clamp(28px,8vw,48px) Oswald;text-transform:uppercase;letter-spacing:.05em;margin:6px 0}
.champ p{color:var(--mut)}
.tbl{display:flex;justify-content:space-between;padding:0 14px 8px;font:500 12px Oswald;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.row{position:relative;display:grid;grid-template-columns:54px 56px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);margin-bottom:10px;padding:12px 14px 12px 0;opacity:0;transform:translateX(60px);transition:.6s cubic-bezier(.2,.9,.3,1)}
.row.show{opacity:1;transform:none}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.rk{height:100%;display:grid;place-items:center;font:700 30px Oswald;color:var(--c);padding-left:6px}
.logo{width:52px;height:52px;display:grid;place-items:center;font:700 20px Oswald;color:#fff;background:linear-gradient(135deg,var(--c),#0b1020);transform:skewX(var(--skew));border:1px solid var(--line)}
.logo b{transform:skewX(12deg)}
.tn{font:700 clamp(17px,4.6vw,24px) Oswald;text-transform:uppercase;letter-spacing:.04em}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pl span{font-size:13px;color:var(--mut);background:var(--card2);padding:2px 9px;border-radius:20px;border:1px solid var(--line)}
.pl span b{color:var(--ink);margin-left:4px}
.pl .hot b{color:#ff5470}
.nums{text-align:right}
.nums .k{font:700 26px Oswald;color:var(--cy);line-height:1}
.nums .k small{display:block;font:500 10px Oswald;letter-spacing:.2em;color:var(--mut);margin-top:2px}
.nums .t{font:600 14px Barlow;margin-top:6px;color:var(--ink)}
.bar{grid-column:2/5;height:5px;background:var(--line);margin-top:-2px;transform:skewX(var(--skew))}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.r1{--c:#ffcf4a}.r2{--c:#d5dcec}.r3{--c:#e39555}.r4{--c:#35d8ff}.r5{--c:#9a7bff}
.r1{background:linear-gradient(90deg,#ffcf4a1f,var(--card) 40%)}
footer{text-align:center;color:var(--mut);margin-top:26px;font:500 12px Oswald;letter-spacing:.3em}
@media(max-width:480px){.row{grid-template-columns:40px 46px 1fr auto;gap:8px}.logo{width:44px;height:44px;font-size:17px}.rk{font-size:24px}}
</style></head><body>
<div class="bgfx"></div>
<div class="wrap">
<div class="ban"><span class="live"><i></i>OFFICIAL RESULTS</span><h1>Free Fire <span>Team Championship</span></h1><p class="sub">Final Match Leaderboard · 5 Teams · 10 Players</p></div>
<div class="strip"><div class="s"><b>5</b><span>Teams</span></div><div class="s"><b>10</b><span>Players</span></div><div class="s"><b>16:04</b><span>Match Time</span></div><div class="s"><b>10</b><span>Total Kills</span></div></div>
<div class="champ"><small>★ CHAMPIONS ★</small><h2>Buriram United Esports</h2><p>Junayed &amp; Tamim · 9 kills · survived 16:04</p></div>
<div class="tbl"><span>Rank / Team</span><span>Kills · Survival</span></div>
<div id="L"></div>
<footer>FREE FIRE · TEAM MATCH · FINAL STANDINGS</footer>
</div>
<script>
var D=[["Buriram United Esports","BU","16:04",[["Junayed",6],["Tamim",3]]],["LOS","LS","16:00",[["Bannah",0],["Arman",1]]],["Fluxo W7M","FX","15:10",[["Muhit",0],["Saharia",0]]],["P Esports","PE","2:39",[["Saadat",0],["Mahdi",0]]],["Team Flash","TF","1:00",[["Kawser",0],["Sumon",0]]]],T=964,H="";
D.forEach(function(t,i){var a=t[2].split(":"),s=a[0]*60+ +a[1],k=t[3][0][1]+t[3][1][1],p=t[3].map(function(x){return'<span'+(x[1]?' class="hot"':'')+'>'+x[0]+'<b>'+x[1]+'K</b></span>'}).join("");
H+='<div class="row r'+(i+1)+'"><div class="rk">'+(i+1)+'</div><div class="logo"><b>'+t[1]+'</b></div><div><div class="tn">'+t[0]+'</div><div class="pl">'+p+'</div></div><div class="nums"><div class="k">'+k+'<small>KILLS</small></div><div class="t">⏱ '+t[2]+'</div></div><div class="bar"><i data-w="'+(s/T*100).toFixed(1)+'"></i></div></div>'});
document.getElementById("L").innerHTML=H;
document.querySelectorAll(".row").forEach(function(r,i){setTimeout(function(){r.classList.add("show");var b=r.querySelector("i");b.style.width=b.dataset.w+"%"},350+i*220)});
</script></body></html>
