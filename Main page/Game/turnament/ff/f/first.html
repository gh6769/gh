<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF Match Result</title>
<style>
:root{--bg:#07070d;--card:#12121f;--fire:#ff4d00;--gold:#ffc400;--silver:#cfd6e4;--bronze:#d98a4e;--text:#f4f4f8;--muted:#9a9ab0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 15%,#ff4d0035,transparent 45%),radial-gradient(circle at 85% 75%,#7a00ff33,transparent 45%);animation:bg 8s ease-in-out infinite alternate;z-index:0}
@keyframes bg{to{transform:scale(1.25) rotate(6deg)}}
.ember{position:fixed;bottom:-20px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--fire);animation:rise linear infinite;z-index:1;opacity:0}
@keyframes rise{10%{opacity:1}100%{transform:translateY(-110vh) translateX(40px);opacity:0}}
main{position:relative;z-index:2;max-width:900px;margin:auto;padding:34px 14px 60px;text-align:center}
h1{font-size:clamp(2rem,8vw,3.8rem);letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,var(--fire),var(--gold),var(--fire));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite,drop 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes shine{to{background-position:200%}}
@keyframes drop{from{transform:translateY(-60px);opacity:0}}
.sub{color:var(--muted);margin:8px 0 26px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.stat{background:var(--card);border:1px solid #ffffff1a;border-radius:14px;padding:12px 22px;animation:pop .7s backwards}
.stat:nth-child(2){animation-delay:.15s}.stat:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.stat b{display:block;font-size:1.6rem;color:var(--gold)}
.stat span{font-size:.8rem;color:var(--muted)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:40px}
.pod{flex:1;max-width:260px;border-radius:18px 18px 0 0;padding:16px 8px 18px;background:linear-gradient(180deg,var(--c),#12121f 90%);border:2px solid var(--c);border-bottom:0;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,1.2,.4,1) backwards;position:relative}
.pod.p1{--c:var(--gold);min-height:300px;animation-delay:.9s}
.pod.p2{--c:var(--silver);min-height:240px;animation-delay:.5s}
.pod.p3{--c:var(--bronze);min-height:200px;animation-delay:.1s}
@keyframes grow{from{transform:scaleY(0);opacity:0}}
.pod .medal{font-size:2.4rem;animation:float 2s ease-in-out infinite}
.p1 .medal{font-size:3.2rem}
@keyframes float{50%{transform:translateY(-8px)}}
.pod .name{font-weight:800;font-size:1.05rem;margin:6px 0;word-break:break-word}
.p1 .name{color:var(--gold);text-shadow:0 0 14px var(--fire);font-size:1.25rem}
.pod .info{font-size:.85rem;color:var(--text);opacity:.85;line-height:1.7}
.p1::after{content:"👑";position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:2rem;animation:float 1.6s ease-in-out infinite}
h2{margin-bottom:16px;letter-spacing:2px;color:var(--gold)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;text-align:left;opacity:0;transform:translateX(-60px);animation:slide .6s forwards;border:1px solid #ffffff14;transition:transform .3s,box-shadow .3s}
.row:hover{transform:translateX(6px) scale(1.02);box-shadow:0 8px 30px #ff4d0044}
@keyframes slide{to{opacity:1;transform:none}}
.rk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--fire),var(--gold));color:#000;flex:none}
.mid{flex:1;min-width:0}
.mid b{display:block;margin-bottom:6px}
.bar{height:8px;border-radius:8px;background:#ffffff18;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--fire),var(--gold));transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.end{text-align:right;font-size:.85rem;color:var(--muted);flex:none;line-height:1.5}
.end strong{color:var(--text);font-size:1rem}
@media(max-width:480px){.pod .info{font-size:.75rem}.pod .name{font-size:.9rem}.p1 .name{font-size:1rem}.end{font-size:.75rem}}
.tw{overflow-x:auto;border-radius:14px;border:1px solid #ffffff1a}table{width:100%;border-collapse:collapse;background:var(--card)}th{background:linear-gradient(90deg,var(--fire),#ff8c00);padding:12px 8px;font-size:.85rem;letter-spacing:1px}td{padding:13px 8px;border-bottom:1px solid #ffffff14}tbody tr{opacity:0;transform:translateY(20px);animation:slide .5s forwards;transition:background .3s}tbody tr:hover{background:#ff4d0022}tbody tr:first-child td{color:var(--gold);font-weight:800;text-shadow:0 0 10px var(--fire)}.pv{font-weight:800;color:var(--gold)}.note{color:var(--muted);font-size:.8rem;margin-top:10px}.conf{position:fixed;top:-20px;width:8px;height:14px;z-index:3;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<main>
  <h1>🔥 Match Result 🔥</h1>
  <p class="sub">Free Fire Tournament Match</p>
  <div class="stats">
    <div class="stat"><b>9:39</b><span>Match Time</span></div>
    <div class="stat"><b>5</b><span>Players</span></div>
    <div class="stat"><b id="tk">0</b><span>Total Kill</span></div>
  </div>
  <div class="podium" id="podium"></div>
  <h2>FULL SCOREBOARD</h2>
  <div id="list"></div>
  <h2 style="margin-top:36px">POINT TABLE</h2>
  <div class="tw"><table id="pt"><thead><tr><th>#</th><th>Player</th><th>Survive</th><th>Kill</th><th>Point</th></tr></thead><tbody></tbody></table></div>
  <p class="note">Point = Survive time ÷ Match time (9:39) × 100</p>
</main>
<script>
for(let i=0;i<30;i++){const e=document.createElement('div');e.className='ember';e.style.left=Math.random()*100+'vw';e.style.animationDuration=(4+Math.random()*6)+'s';e.style.animationDelay=Math.random()*6+'s';document.body.appendChild(e)}
const P=[
 {n:'BAD DAVIL',t:'9:39',k:2,r:1},
 {n:'taki',t:'9:38',k:1,r:2},
 {n:'muhit',t:'8:25',k:0,r:3},
 {n:'sayem',t:'8:15',k:1,r:4},
 {n:'raki',t:'5:11',k:0,r:5}
];
const sec=s=>{const a=s.split(':');return +a[0]*60+ +a[1]};
const total=sec('9:39');
P.forEach(p=>p.pt=(sec(p.t)/total*100).toFixed(1));
const medal={1:'🥇',2:'🥈',3:'🥉'};
const pod=document.getElementById('podium');
[2,1,3].forEach(r=>{const p=P.find(x=>x.r===r);pod.insertAdjacentHTML('beforeend',
 `<div class="pod p${r}"><div class="medal">${medal[r]}</div><div class="name">${p.n}</div><div class="info">⏱ ${p.t}<br>💀 ${p.k} Kill<br>⭐ ${p.pt} Point</div></div>`)});
const list=document.getElementById('list');
P.forEach((p,i)=>{const pct=Math.round(sec(p.t)/total*100);
 list.insertAdjacentHTML('beforeend',
 `<div class="row" style="animation-delay:${1.6+i*.2}s"><div class="rk">${p.r}</div><div class="mid"><b>${p.n}</b><div class="bar"><i data-w="${pct}"></i></div></div><div class="end"><strong>${p.pt} pt</strong><br>⏱ ${p.t} · 💀 ${p.k}</div></div>`)});
setTimeout(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'),2000);
let c=0;const tot=P.reduce((a,p)=>a+p.k,0);const tk=document.getElementById('tk');
const iv=setInterval(()=>{tk.textContent=c;if(c>=tot)clearInterval(iv);c++},300);
const tb=document.querySelector('#pt tbody');
P.forEach((p,i)=>{tb.insertAdjacentHTML('beforeend',`<tr style="animation-delay:${2.4+i*.2}s"><td>${medal[p.r]||p.r}</td><td>${p.n}</td><td>${p.t}</td><td>${p.k}</td><td class="pv" data-v="${p.pt}">0.0</td></tr>`)});
setTimeout(()=>document.querySelectorAll('.pv').forEach(e=>{const v=+e.dataset.v,s=performance.now();(function f(n){const x=Math.min((n-s)/1500,1);e.textContent=(v*x).toFixed(1);if(x<1)requestAnimationFrame(f)})(s)}),2600);
for(let i=0;i<40;i++){const c=document.createElement('span');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=['#ffc400','#ff4d00','#7a00ff','#fff'][i%4];c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(1.5+Math.random())+'s';document.body.appendChild(c)}
</script>
</body>
</html>
