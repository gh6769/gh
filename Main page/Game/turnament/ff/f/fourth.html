<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF Grand Finale</title>
<style>
:root{--bg:#07041a;--gold:#ffd24a;--pur:#8a2be2;--pink:#ff5fa2;--text:#f6f1ff;--muted:#9d93c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;min-height:100%;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;width:100%;height:100%}
body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 0,#8a2be255,transparent 60%),radial-gradient(circle at 90% 90%,#ff5fa233,transparent 50%)}
main{position:relative;z-index:2;max-width:900px;margin:auto;padding:34px 14px 80px;text-align:center}
h1{font-size:clamp(2rem,9vw,4.2rem);letter-spacing:6px;text-transform:uppercase;background:linear-gradient(100deg,#fff2b0,var(--gold),#ff9a3d,var(--gold),#fff2b0);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gl 4s linear infinite,rise 1.1s backwards}
@keyframes gl{to{background-position:250%}}
@keyframes rise{from{transform:scale(1.6);opacity:0;letter-spacing:30px}}
.sub{color:var(--muted);letter-spacing:5px;font-size:.75rem;margin:8px 0 22px;font-family:Arial,sans-serif}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px;font-family:Arial,sans-serif}
.chip{padding:9px 18px;border-radius:40px;background:#ffffff10;border:1px solid #ffd24a66;color:var(--gold);font-weight:700;animation:pop .6s backwards}
.chip:nth-child(2){animation-delay:.15s}.chip:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0);opacity:0}}
.spot{position:relative;padding-top:20px}
.spot::before{content:"";position:absolute;left:50%;top:0;width:340px;height:100%;transform:translateX(-50%);background:conic-gradient(from 165deg at 50% 0,transparent,#ffd24a33 5deg,transparent 30deg);animation:sw 5s ease-in-out infinite alternate;transform-origin:top;z-index:-1}
@keyframes sw{from{transform:translateX(-50%) rotate(-14deg)}to{transform:translateX(-50%) rotate(14deg)}}
.crown{font-size:3rem;display:block;animation:fl 2s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--gold))}
@keyframes fl{50%{transform:translateY(-10px)}}
.cw{letter-spacing:8px;color:var(--gold);font-size:.8rem;font-family:Arial,sans-serif}
.cn{font-size:clamp(2.4rem,11vw,4.4rem);font-weight:900;text-transform:uppercase;color:#fff;text-shadow:0 0 30px var(--gold),0 0 60px var(--pur);margin:4px 0}
.stage{perspective:900px;margin:34px 0 14px}
.pods{display:flex;align-items:flex-end;justify-content:center;gap:6px;transform-style:preserve-3d;animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotateY(-14deg) rotateX(6deg)}to{transform:rotateY(14deg) rotateX(6deg)}}
.pd{position:relative;flex:1;max-width:210px;border-radius:10px 10px 0 0;padding:14px 6px 12px;background:linear-gradient(180deg,var(--c),#1a0f3a 95%);box-shadow:0 0 30px color-mix(in srgb,var(--c) 45%,transparent);transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,1.2,.4,1) var(--d) backwards;color:#12082b}
.pd::before{content:"";position:absolute;top:-12px;left:0;right:0;height:12px;background:var(--c);filter:brightness(1.35);transform:perspective(60px) rotateX(55deg);transform-origin:bottom;border-radius:6px 6px 0 0}
@keyframes grow{from{transform:scaleY(0);opacity:0}}
.p1{--c:#ffd24a;--d:.9s;min-height:230px}.p2{--c:#c9d3ff;--d:.5s;min-height:185px}.p3{--c:#ff9a56;--d:.1s;min-height:150px}
.pd .m{font-size:2.2rem}.pd b{display:block;font-size:1.05rem;text-transform:uppercase;word-break:break-word}
.pd small{font-family:Arial,sans-serif;font-size:.75rem;font-weight:700;line-height:1.6}
h2{letter-spacing:5px;color:var(--gold);font-size:1rem;margin:40px 0 16px;font-family:Arial,sans-serif;text-transform:uppercase}
.orbit{position:relative;width:min(330px,86vw);aspect-ratio:1;margin:auto}
.sun{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2rem;filter:drop-shadow(0 0 20px var(--gold));animation:fl 3s infinite}
.ring{position:absolute;left:50%;top:50%;border:1px dashed #ffffff26;border-radius:50%;transform:translate(-50%,-50%) rotate(0);animation:spin var(--s) linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ring i{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.leg{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:16px;font-family:Arial,sans-serif;font-size:.78rem}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;box-shadow:0 0 8px var(--c)}
.aw{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;font-family:Arial,sans-serif}
.a{padding:16px;border-radius:16px;background:linear-gradient(135deg,#8a2be233,#ffffff0a);border:1px solid #ffffff22;transition:.3s;animation:pop .6s backwards}
.a:hover{transform:translateY(-6px) rotate(-1deg);border-color:var(--gold);box-shadow:0 10px 30px #ffd24a33}
.a em{font-style:normal;font-size:1.8rem;display:block}.a b{color:var(--gold);display:block;margin:4px 0}.a span{font-size:.8rem;color:var(--muted)}
.lh,.lr{display:grid;grid-template-columns:40px 1fr 54px 50px 60px;align-items:center;gap:8px;padding:12px 12px;text-align:left;font-family:Arial,sans-serif}
.lh{color:var(--muted);font-size:.7rem;letter-spacing:2px}
.lr{margin-bottom:9px;border-radius:14px;background:linear-gradient(90deg,#8a2be230,#ffffff08);border:1px solid #ffffff1a;opacity:0;transform:translateX(-50px) scale(.96);transition:opacity .6s,transform .6s,background .3s,border-color .3s}
.lr.in{opacity:1;transform:none}
.lr:hover{border-color:var(--gold);background:linear-gradient(90deg,#ffd24a2a,#ffffff0a)}
.lr:nth-child(1){border-color:var(--gold);background:linear-gradient(90deg,#ffd24a33,#ffffff08)}
.rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--c);color:#12082b}
.nm{font-weight:700;overflow:hidden}.nm small{display:block;font-weight:400;color:var(--muted);font-size:.7rem;margin-top:2px}
.bar{height:5px;margin-top:6px;border-radius:5px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--pur),var(--pink),var(--gold));transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.pv{font-weight:900;color:var(--gold);text-align:right}
.note{color:var(--muted);font-size:.72rem;margin-top:10px;font-family:Arial,sans-serif}
@media(max-width:480px){.lh,.lr{grid-template-columns:34px 1fr 44px 40px 52px;font-size:.78rem;gap:5px;padding:10px 8px}.rk{width:28px;height:28px}.pd .m{font-size:1.6rem}.pd b{font-size:.85rem}.pd small{font-size:.65rem}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <h1>Grand Finale</h1>
  <p class="sub">FREE FIRE · 7 PLAYER TOURNAMENT MATCH</p>
  <div class="chips"><div class="chip">⏱ 12:07</div><div class="chip">👥 7 Players</div><div class="chip">💀 <span id="tk">0</span> Kill</div></div>
  <div class="spot"><span class="crown">👑</span><div class="cw">★ BOOYAH · CHAMPION ★</div><div class="cn" id="cn"></div></div>
  <div class="stage"><div class="pods" id="pods"></div></div>
  <h2>Survival Orbit</h2>
  <div class="orbit"><span class="sun">☀️</span><div id="rings"></div></div>
  <div class="leg" id="leg"></div>
  <h2>Awards</h2>
  <div class="aw" id="aw"></div>
  <h2>Point Table</h2>
  <div class="lh"><span>#</span><span>PLAYER</span><span>TIME</span><span>KILL</span><span style="text-align:right">POINT</span></div>
  <div id="lb"></div>
  <p class="note">POINT = SURVIVE TIME ÷ MATCH TIME (12:07) × 100</p>
</main>
<script>
const P=[{n:'saadat',t:'12:07',k:3},{n:'sayem',t:'12:05',k:1},{n:'muhit',t:'11:32',k:1},{n:'tamim',t:'9:05',k:0},{n:'raki',t:'7:24',k:1},{n:'saharia',t:'4:38',k:0},{n:'arman',t:'2:34',k:0}];
const col=['#ffd24a','#c9d3ff','#ff9a56','#5fe3ff','#ff5fa2','#9dff6a','#b48cff'];
const sec=s=>{const a=s.split(':');return +a[0]*60+ +a[1]};
const $=id=>document.getElementById(id),T=sec('12:07'),medal=['🥇','🥈','🥉'];
P.forEach((p,i)=>{p.r=i+1;p.s=sec(p.t);p.pt=(p.s/T*100).toFixed(1);p.c=col[i]});
$('cn').textContent=P[0].n;
const tot=P.reduce((a,p)=>a+p.k,0);let c=0;const iv=setInterval(()=>{$('tk').textContent=c;if(c>=tot)clearInterval(iv);c++},300);
$('pods').innerHTML=[1,0,2].map(i=>{const p=P[i];return `<div class="pd p${i+1}"><div class="m">${medal[i]}</div><b>${p.n}</b><small>⏱ ${p.t}<br>💀 ${p.k} Kill<br>⭐ ${p.pt}</small></div>`}).join('');
$('rings').innerHTML=P.map((p,i)=>`<div class="ring" style="--c:${p.c};--s:${7+i*2.5}s;width:${96-i*11}%;height:${96-i*11}%;animation-delay:-${i*1.7}s"><i></i></div>`).join('');
$('leg').innerHTML=P.map(p=>`<span style="--c:${p.c}">${p.n}</span>`).join('');
const tp=[...P].sort((a,b)=>b.k-a.k)[0],gap=P[0].s-P[1].s;
$('aw').innerHTML=[['🔪','Top Killer',tp.n+' · '+tp.k+' kill'],['⚡','Closest Finish','Only '+gap+' sec between 1st and 2nd'],['🚪','First Out',P[6].n+' · '+P[6].t]].map((a,i)=>`<div class="a" style="animation-delay:${.8+i*.15}s"><em>${a[0]}</em><b>${a[1]}</b><span>${a[2]}</span></div>`).join('');
$('lb').innerHTML=P.map(p=>`<div class="lr" data-v="${p.pt}"><span class="rk" style="--c:${p.c}">${p.r}</span><span class="nm">${p.n}<small>${'💀'.repeat(p.k)||'—'}</small><div class="bar"><i></i></div></span><span>${p.t}</span><span>${p.k}</span><span class="pv">0.0</span></div>`).join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const r=e.target,i=[...r.parentNode.children].indexOf(r);
 setTimeout(()=>{r.classList.add('in');r.querySelector('.bar i').style.width=r.dataset.v+'%';const v=+r.dataset.v,s=performance.now(),el=r.querySelector('.pv');(function f(n){const x=Math.min((n-s)/1500,1);el.textContent=(v*x).toFixed(1);if(x<1)requestAnimationFrame(f)})(s)},i*120)}),{threshold:.2});
document.querySelectorAll('.lr').forEach(r=>io.observe(r));
const cv=$('sky'),g=cv.getContext('2d');let W,H;const S=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<110;i++)S.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,p:Math.random()*6});
let sh=null;
(function d(t){g.clearRect(0,0,W,H);S.forEach(s=>{g.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));g.fillStyle='#fff';g.beginPath();g.arc(s.x*W,s.y*H,s.r,0,7);g.fill()});
 if(!sh&&Math.random()<.008)sh={x:Math.random()*W,y:Math.random()*H*.4,l:0};
 if(sh){g.globalAlpha=1-sh.l/60;g.strokeStyle='#ffd24a';g.lineWidth=2;g.beginPath();g.moveTo(sh.x+sh.l*8,sh.y+sh.l*4);g.lineTo(sh.x+sh.l*8+40,sh.y+sh.l*4+20);g.stroke();if(++sh.l>60)sh=null}
 requestAnimationFrame(d)})(0);
</script>
</body>
</html>
