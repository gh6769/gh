
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d1b">
<title>Our Members | Contact Directory</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#080c19;
 --line:rgba(153,177,255,.16);
 --cyan:#58e6ff;
 --purple:#a78bfa;
 --muted:#9ba8c8;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html{scroll-behavior:smooth}

body{
 min-height:100vh;
 color:#f4f7ff;
 background:
 radial-gradient(ellipse at 15% 5%,#19244a 0,transparent 38%),
 radial-gradient(ellipse at 90% 30%,#241747 0,transparent 35%),
 var(--bg);
 font-family:'Outfit','Hind Siliguri',sans-serif;
 overflow-x:hidden;
}

body:before,body:after{
 content:"";
 position:fixed;
 width:340px;
 height:340px;
 border-radius:50%;
 filter:blur(90px);
 opacity:.16;
 pointer-events:none;
 z-index:-1;
 animation:float 12s ease-in-out infinite alternate;
}

body:before{
 background:#15c8e8;
 top:15%;
 left:-160px;
}

body:after{
 background:#8957ff;
 right:-150px;
 bottom:5%;
 animation-delay:-5s;
}

@keyframes float{
 to{transform:translate(90px,-65px) scale(1.2)}
}

@keyframes rise{
 from{
  opacity:0;
  transform:translateY(22px);
 }
 to{
  opacity:1;
  transform:translateY(0);
 }
}

.wrap{
 width:min(1180px,92%);
 margin:auto;
 padding:48px 0 60px;
}

.hero{
 text-align:center;
 margin-bottom:30px;
 animation:rise .8s both;
}

.eyebrow{
 display:inline-flex;
 align-items:center;
 gap:8px;
 padding:8px 14px;
 border:1px solid var(--line);
 border-radius:30px;
 background:#ffffff08;
 color:#b9c9f5;
 font-size:12px;
 letter-spacing:2px;
}

.pulse{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#5df0c1;
 box-shadow:0 0 12px #5df0c1;
}

h1{
 font-size:clamp(34px,6vw,64px);
 line-height:1.05;
 margin:19px 0 10px;
 font-weight:800;
 letter-spacing:-2px;
}

h1 span{
 background:linear-gradient(100deg,#fff 10%,#69eaff 48%,#b69aff 90%);
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
}

.sub{
 color:var(--muted);
 font-family:'Hind Siliguri',sans-serif;
 font-size:16px;
}

.stats{
 display:flex;
 justify-content:center;
 gap:12px;
 margin:25px 0 30px;
 flex-wrap:wrap;
}

.stat{
 border:1px solid var(--line);
 background:#ffffff08;
 padding:10px 17px;
 border-radius:13px;
 color:#b8c7e9;
 font-size:13px;
}

.stat b{
 color:#fff;
 font-size:17px;
 margin-right:5px;
}

.toolbar{
 display:flex;
 gap:12px;
 max-width:720px;
 margin:0 auto 28px;
}

.search{
 flex:1;
 position:relative;
}

.search span{
 position:absolute;
 left:17px;
 top:50%;
 transform:translateY(-50%);
 color:#91a2cb;
 font-size:22px;
}

input[type=search]{
 width:100%;
 height:52px;
 border-radius:15px;
 border:1px solid var(--line);
 background:#111a31cc;
 color:white;
 padding:0 18px 0 48px;
 outline:none;
 font:500 14px 'Outfit',sans-serif;
 transition:.25s;
}

input[type=search]:focus{
 border-color:#58e6ff88;
 box-shadow:0 0 0 4px #58e6ff12;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
 gap:17px;
}

.card{
 position:relative;
 isolation:isolate;
 overflow:hidden;
 border:1px solid var(--line);
 border-radius:21px;
 padding:19px;
 background:linear-gradient(145deg,rgba(27,38,68,.92),rgba(13,19,37,.88));
 box-shadow:0 12px 35px #0003;
 animation:rise .65s both;
 transition:transform .35s,border-color .35s,box-shadow .35s;
}

.card:before{
 content:"";
 position:absolute;
 inset:-1px;
 z-index:-1;
 opacity:0;
 background:linear-gradient(120deg,#58e6ff33,transparent 40%,#a78bfa33);
 transition:opacity .35s;
}

.card:hover{
 transform:translateY(-7px);
 border-color:#7ceaff77;
 box-shadow:0 18px 45px #0006,0 0 28px #58e6ff13;
}

.card:hover:before{opacity:1}

.card:after{
 content:"";
 position:absolute;
 width:130px;
 height:130px;
 border:1px solid #91aaff18;
 border-radius:50%;
 right:-75px;
 top:-75px;
 transition:transform .5s;
}

.card:hover:after{
 transform:scale(2.2);
}

.top{
 display:flex;
 align-items:center;
 gap:13px;
 position:relative;
}

.avatar{
 width:58px;
 height:58px;
 flex:0 0 58px;
 border-radius:17px;
 overflow:hidden;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,#1bbed1,#7958dc);
 border:1px solid #ffffff30;
 box-shadow:0 5px 18px #0004;
 color:white;
 font-size:21px;
 font-weight:700;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.meta{
 min-width:0;
 flex:1;
}

.num{
 font-size:11px;
 color:#70e7f7;
 letter-spacing:2px;
 font-weight:700;
}

.name{
 font-size:15px;
 font-weight:700;
 line-height:1.35;
 margin-top:5px;
 overflow-wrap:anywhere;
 min-height:40px;
}

.rule{
 height:1px;
 background:linear-gradient(90deg,#65eaff33,transparent);
 margin:17px 0 13px;
}

.phone-label{
 font-size:10px;
 letter-spacing:1.7px;
 color:#8999bd;
 margin-bottom:7px;
}

.phone{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 text-decoration:none;
 color:#fff;
 font-size:17px;
 font-weight:600;
 letter-spacing:.4px;
 padding:11px 12px;
 border-radius:12px;
 background:#080f20;
 border:1px solid #ffffff0d;
 transition:.25s;
}

.phone:hover{
 background:#102a3a;
 border-color:#58e6ff88;
 color:#77edff;
 box-shadow:0 0 20px #58e6ff17;
}

.call{
 font-size:18px;
 color:#5ce7c1;
}

.copy-btn{
 width:100%;
 margin-top:11px;
 border:1px solid #ffffff16;
 background:#ffffff08;
 color:#aebde0;
 padding:10px;
 border-radius:10px;
 font:500 12px 'Hind Siliguri',sans-serif;
 cursor:pointer;
 transition:.2s;
}

.copy-btn:hover{
 background:#ffffff14;
 color:white;
 border-color:#7c8cff77;
}

.empty{
 grid-column:1/-1;
 text-align:center;
 color:#aab7d5;
 padding:45px;
}

.footer{
 text-align:center;
 color:#68799e;
 font-size:11px;
 margin-top:34px;
 letter-spacing:1px;
}

@media(max-width:560px){
 .wrap{padding-top:32px}
 .toolbar{margin-bottom:20px}
 .grid{
  grid-template-columns:1fr 1fr;
  gap:10px;
 }
 .card{
  padding:13px;
  border-radius:17px;
 }
 .avatar{
  width:47px;
  height:47px;
  flex-basis:47px;
  border-radius:14px;
 }
 .name{
  font-size:12px;
  min-height:48px;
 }
 .phone{
  font-size:13px;
  padding:10px 8px;
 }
 .phone-label{font-size:9px}
 .copy-btn{
  font-size:10px;
  padding:9px 4px;
 }
}

@media(max-width:370px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<main class="wrap">

<header class="hero">

 <div class="eyebrow">
  <i class="pulse"></i>
  CONTACT DIRECTORY
 </div>

 <h1><span>Our Members</span></h1>

 <p class="sub">
  সবার যোগাযোগের তথ্য এক জায়গায়
 </p>

 <div class="stats">
  <div class="stat">
   <b id="total">28</b> Members
  </div>

  <div class="stat">
   <b>24/7</b> Quick Contact
  </div>
 </div>

</header>

<div class="toolbar">

 <div class="search">
  <span>⌕</span>

  <input
   id="search"
   type="search"
   placeholder="নাম অথবা ফোন নম্বর দিয়ে খুঁজুন..."
   aria-label="Search contacts"
  >
 </div>

</div>

<section
 class="grid"
 id="grid"
 aria-label="Member contacts"
></section>

<footer class="footer">
 ✦ &nbsp; CONNECT • RESPECT • TOGETHER &nbsp; ✦
</footer>

</main>

<script>

/* =========================================
   MEMBER INFORMATION & GITHUB PHOTO LINKS

   Format:
   ["NAME", "PHONE", "GITHUB PHOTO DIRECT LINK"]

   ছবি না থাকলে তৃতীয় জায়গাটি খালি রাখবে।
========================================= */

const members = [

["MD NADIM","01781587138","nadim.jpg"],
["SAKIBUL HASAN ADIL","01720984173","adil.jpg"],
["MD JIHADUL ISLAM","01780934251","jihad.jpg"],
["MOHAMMAD MIZANUR RAHMAN","01726005059","mizan.jpg"],
["MD FAHKRUL ISLAM","01819477690","fokhrul.jpg"],
["MD FOYSAL HOSSAN","01869207660","foysal.jpg"],
["MD KHANDOKER MOBASSER","01766727040","mubassir.jpg"],
["ASHIK MAHMUD BIN AZAD","01815458028","asik.jpg"],
["MD SHEYAB","01781241204","sihab.jpg"],
["NAIMUL HASAN MAHFUJ","01715273048","mahfuj.jpg"],
["ABDULLAH RIFAT","01718063166","abdullahh.jpg"],
["MD NAZIMUDDIN JAKIR","01818233515","jakir.jpg"],
["IBNE SHAIK MAHADI","01714911311","mahdi.jpg"],
["MEZBAUL HASAN MOKTO","01866939730","mokto.jpg"],
["MD MAHFUZUL AMIN MARJAN","01715777370","marjan.jpg"],
["MUHAMMAD JHID HASAN MARUF","01711000141","jhid.jpg"],
["RAIN MAHBUB","01770555362","rain.jpg"],
["KHALED MD SAIFULLAH","01718041136","khaled.jpg"],
["MEER MONTASIR MOHAMMAD MOHI UDDIN","01814372935","montasir.jpg"],
["ABDULLAH MD ABU MAHID","01756370015","mahid.jpg"],
["MD ALAMGEER HOSSAIN","01820712848","alamgeer.jpg"],
["NURAJ ISLAM","01723590751","nuraj.jpg"],
["MD. FUAD HASAN","01717171917","fuad.jpg"],
["MD MAHIR SAHAREAR ABIR","01714667427","abir.jpg"],
["MD SAZZAD HOSSAIN RAIHAN SARKER","01612948228","sazzad.jpg"],
["MD TAQI TAHMID KHANDAKER","01683260750","taki.jpg"],
["MD ATIQUR RAHMAN","01718850275",""],
["MD. IBRAHIM MOLLA","01715658595",""]

];


/* =========================================
   DISPLAY MEMBERS
========================================= */

const grid = document.getElementById("grid");

function initials(name){
 return name
  .split(/\s+/)
  .slice(0,2)
  .map(x=>x[0])
  .join("");
}


function render(list){

 grid.innerHTML = "";

 if(!list.length){

  grid.innerHTML =
   '<div class="empty">কোনো সদস্য পাওয়া যায়নি।</div>';

  return;
 }

 list.forEach(([name,phone,photo])=>{

  const index = members.findIndex(
   m=>m[0]===name
  );

  const card = document.createElement("article");
  card.className = "card";

  card.style.animationDelay =
   (index%8)*0.045+"s";


  /* AVATAR */

  const avatar = document.createElement("div");
  avatar.className = "avatar";

  if(photo && photo.trim() !== ""){

   const img = document.createElement("img");

   img.src = photo.trim();
   img.alt = name + " photo";
   img.loading = "lazy";

   img.onerror = function(){

    avatar.innerHTML = "";

    const fallback = document.createElement("span");
    fallback.textContent = initials(name);

    avatar.appendChild(fallback);
   };

   avatar.appendChild(img);

  }else{

   const fallback = document.createElement("span");

   fallback.textContent = initials(name);

   avatar.appendChild(fallback);
  }


  /* MEMBER NAME */

  const top = document.createElement("div");
  top.className = "top";

  const meta = document.createElement("div");
  meta.className = "meta";

  const num = document.createElement("div");
  num.className = "num";

  num.textContent =
   String(index+1).padStart(2,"0");

  const title = document.createElement("div");
  title.className = "name";

  title.textContent = name;

  meta.append(num,title);

  top.append(avatar,meta);


  /* DIVIDER */

  const rule = document.createElement("div");
  rule.className = "rule";


  /* PHONE LABEL */

  const label = document.createElement("div");
  label.className = "phone-label";

  label.textContent = "PHONE NUMBER";


  /* CALL LINK */

  const link = document.createElement("a");

  link.className = "phone";

  link.href = "tel:"+phone;

  const number = document.createElement("span");
  number.textContent = phone;

  const call = document.createElement("span");

  call.className = "call";
  call.textContent = "↗";

  link.append(number,call);


  /* COPY BUTTON */

  const copy = document.createElement("button");

  copy.className = "copy-btn";
  copy.type = "button";
  copy.textContent = "নম্বর কপি";

  copy.addEventListener("click",async()=>{

   try{

    await navigator.clipboard.writeText(phone);

    copy.textContent = "কপি হয়েছে ✓";

    setTimeout(()=>{
     copy.textContent = "নম্বর কপি";
    },1400);

   }catch(e){

    copy.textContent = phone;

   }

  });


  /* FINAL CARD */

  card.append(
   top,
   rule,
   label,
   link,
   copy
  );

  grid.appendChild(card);

 });

}


/* =========================================
   SEARCH SYSTEM
========================================= */

document.getElementById("search")
.addEventListener("input",e=>{

 const q = e.target.value
  .trim()
  .toLowerCase();

 const filtered = members.filter(([name,phone])=>{

  return (
   name.toLowerCase().includes(q) ||
   phone.includes(q)
  );

 });

 render(filtered);

});


/* TOTAL MEMBERS */

document.getElementById("total").textContent =
 members.length;


/* INITIAL LOAD */

render(members);

</script>

</body>
</html>
