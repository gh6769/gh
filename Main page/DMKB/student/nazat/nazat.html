<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Directory</title>
<style>
:root{--bg:#0a0b1e;--ink:#f3f1ff;--mute:#9a98c4;--a:#7cf5d4;--b:#8b7bff;--c:#ff7ad9;--card:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Poppins","Hind Siliguri","Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;animation:drift 18s ease-in-out infinite alternate}
.o1{width:420px;height:420px;background:var(--b);top:-120px;left:-100px}
.o2{width:380px;height:380px;background:var(--c);bottom:-120px;right:-80px;animation-delay:-6s}
.o3{width:300px;height:300px;background:var(--a);top:45%;left:55%;animation-delay:-11s;opacity:.28}
@keyframes drift{to{transform:translate(120px,80px) scale(1.25)}}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:48px 20px 80px}
header{text-align:center;margin-bottom:34px}
h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.sub{color:var(--mute);margin-top:8px}
.sub b{color:var(--a)}
.search{display:block;margin:26px auto 0;width:min(440px,100%);padding:14px 20px;border-radius:999px;border:1.5px solid rgba(255,255,255,.14);background:var(--card);color:var(--ink);font-size:1rem;outline:none;backdrop-filter:blur(8px);transition:.3s}
.search:focus{border-color:var(--a);box-shadow:0 0 0 5px rgba(124,245,212,.15);width:min(500px,100%)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;perspective:1000px}
.card{position:relative;padding:2px;border-radius:24px;opacity:0;transform:rotateX(-70deg) translateY(40px);animation:enter .8s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i)*60ms);transform-style:preserve-3d}
@keyframes enter{to{opacity:1;transform:none}}
.card.hide{display:none}
.card::before{content:"";position:absolute;inset:0;border-radius:24px;background:conic-gradient(from var(--ang,0deg),transparent 0 70%,var(--a),var(--b),var(--c),transparent);opacity:0;transition:opacity .4s;animation:spin 3s linear infinite}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.card:hover::before{opacity:1}
.inner{position:relative;border-radius:22px;background:linear-gradient(160deg,#171839,#101129);padding:26px 20px 20px;text-align:center;overflow:hidden;transition:transform .15s;height:100%}
.inner::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(var(--glow,rgba(139,123,255,.35)),transparent 70%);left:var(--mx,50%);top:var(--my,0%);transform:translate(-50%,-50%);transition:left .1s,top .1s;pointer-events:none}
.num{position:absolute;top:12px;left:16px;font-size:.78rem;color:var(--mute);font-weight:600}
.avatar{position:relative;width:104px;height:104px;margin:6px auto 16px;border-radius:50%;cursor:pointer;animation:float 4s ease-in-out infinite;animation-delay:calc(var(--i)*-300ms)}
@keyframes float{50%{transform:translateY(-7px)}}
.ring{position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--h1),var(--h2),var(--h1));animation:rot 5s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.pic{position:absolute;inset:0;border-radius:50%;background:#101129 center/cover no-repeat;border:4px solid #101129;display:grid;place-items:center;font-size:2rem;font-weight:800;overflow:hidden;transition:transform .35s}
.avatar:hover .pic{transform:scale(1.07) rotate(-4deg)}
.cam{position:absolute;right:-2px;bottom:0;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-size:.9rem;border:3px solid #101129;transition:transform .3s}
.avatar:hover .cam{transform:scale(1.2) rotate(15deg)}
.del{position:absolute;left:-2px;bottom:0;width:28px;height:28px;border-radius:50%;background:#ff5a7a;border:3px solid #101129;color:#fff;font-size:.7rem;cursor:pointer;display:none;place-items:center}
.has .del{display:grid}
.name{font-weight:700;font-size:1.02rem;line-height:1.3;min-height:2.6em;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.call{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 14px;border-radius:16px;text-decoration:none;color:#06241d;font-weight:700;letter-spacing:.03em;background:linear-gradient(120deg,var(--a),#5fd0ff);overflow:hidden;transition:transform .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
.call:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 12px 28px -8px rgba(124,245,212,.7)}
.call:active{transform:scale(.96)}
.call::before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*120ms)}
@keyframes shine{60%,100%{left:140%}}
.ph{display:inline-block;animation:ring 2.4s ease-in-out infinite;transform-origin:50% 50%}
@keyframes ring{0%,60%,100%{transform:rotate(0)}5%,15%,25%,35%{transform:rotate(-18deg)}10%,20%,30%,40%{transform:rotate(18deg)}}
.call.go .ph{animation:ring .5s linear infinite}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.65);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.pt{position:fixed;z-index:50;pointer-events:none;font-size:1.3rem;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,120px);background:#1b1c44;border:1px solid var(--a);color:var(--ink);padding:12px 22px;border-radius:999px;z-index:60;transition:transform .5s cubic-bezier(.2,1.4,.4,1);font-size:.95rem}
.toast.show{transform:translate(-50%,0)}
.empty{display:none;text-align:center;color:var(--mute);margin-top:40px}
:focus-visible{outline:3px solid var(--a);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<main>
<header>
<h1>Member Directory</h1>
<p class="sub"><b id="cnt">28</b> members</p>
<input class="search" id="q" type="search" placeholder="Name ba number diye khujun…" aria-label="Search">
</header>
<section class="grid" id="grid"></section>
<p class="empty" id="empty">Kono member paoa jayni. Onno kichu likhe dekhun.</p>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const D=[["MD NADIM","01781587138"],["SAKIBUL HASAN ADIL","01720984173"],["MD JIHADUL ISLAM","01780934251"],["MOHAMMAD MIZANUR RAHMAN","01726005059"],["MD FAHKRUL ISLAM","01819477690"],["MD FOYSAL HOSSAN","01869207660"],["MD KHANDOKER MOBASSER","01766727040"],["ASHIK MAHMUD BIN AZAD","01815458028"],["MD SHEYAB","01781241204"],["NAIMUL HASAN MAHFUJ","01715273048"],["ABDULLAH RIFAT","01718063166"],["MD NAZIMUDDIN JAKIR","01818233515"],["IBNE SHAIK MAHADI","01714911311"],["MEZBAUL HASAN MOKTO","01866939730"],["MD MAHFUZUL AMIN MARJAN","01715777370"],["MUHAMMAD JHID HASAN MARUF","01711000141"],["RAIN MAHBUB","01770555362"],["KHALED MD SAIFULLAH","01718041136"],["MEER MONTASIR MOHAMMAD MOHI UDDIN","01814372935"],["ABDULLAH MD ABU MAHID","01756370015"],["MD ALAMGEER HOSSAIN","01820712848"],["NURAJ ISLAM","01723590751"],["MD. FUAD HASAN","01717171917"],["MD MAHIR SAHAREAR ABIR","01714667427"],["MD SAZZAD HOSSAIN RAIHAN SARKER","01612948228"],["MD TAQI TAHMID KHANDAKER","01683260750"],["MD ATIQUR RAHMAN","01718850275"],["MD. IBRAHIM MOLLA","01715658595"]];
const grid=document.getElementById('grid'),file=document.getElementById('file'),toastEl=document.getElementById('toast');
let target=null,tt;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),2200)}
function initials(n){return n.replace(/\./g,'').split(' ').filter(w=>w!=='MD').slice(0,2).map(w=>w[0]).join('')}
function hue(i){return (i*47+160)%360}
function setPic(card,url){const p=card.querySelector('.pic');if(url){p.style.backgroundImage=`url(${url})`;p.textContent='';card.classList.add('has')}else{p.style.backgroundImage='';p.textContent=card.dataset.ini;card.classList.remove('has')}}
D.forEach(([n,ph],i)=>{
 const h=hue(i),el=document.createElement('article');
 el.className='card';el.dataset.s=(n+' '+ph).toLowerCase();el.dataset.ini=initials(n);el.dataset.id=ph;
 el.style.cssText=`--i:${i};--h1:hsl(${h} 90% 65%);--h2:hsl(${(h+70)%360} 90% 65%);--glow:hsla(${h},90%,65%,.35)`;
 el.innerHTML=`<div class="inner"><span class="num">${String(i+1).padStart(2,'0')}</span>
 <div class="avatar" role="button" tabindex="0" aria-label="Photo add korun: ${n}"><div class="ring"></div><div class="pic"></div><span class="cam">📷</span><button class="del" title="Photo soriye din" aria-label="Photo soriye din">✕</button></div>
 <div class="name">${n}</div>
 <a class="call" href="tel:${ph}"><span class="ph">📞</span><span>${ph}</span></a></div>`;
 grid.appendChild(el);
 setPic(el,store.get('pic-'+ph));
 const av=el.querySelector('.avatar');
 const pick=()=>{target=el;file.value='';file.click()};
 av.addEventListener('click',e=>{if(e.target.closest('.del'))return;pick()});
 av.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}});
 el.querySelector('.del').addEventListener('click',()=>{store.del('pic-'+ph);setPic(el,null);toast('Photo soriye deoa hoyeche')});
 const inner=el.querySelector('.inner');
 el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;inner.style.transform=`rotateY(${(x-.5)*12}deg) rotateX(${(.5-y)*12}deg)`;inner.style.setProperty('--mx',x*100+'%');inner.style.setProperty('--my',y*100+'%')});
 el.addEventListener('mouseleave',()=>{inner.style.transform=''});
 const call=el.querySelector('.call');
 call.addEventListener('click',e=>{
  const r=call.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');
  d.className='rip';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;call.appendChild(d);setTimeout(()=>d.remove(),700);
  call.classList.add('go');setTimeout(()=>call.classList.remove('go'),1500);
  const em=['✨','📞','💜','⭐','💚','🎉'];
  for(let k=0;k<14;k++){const p=document.createElement('span'),a=Math.random()*Math.PI*2,dist=70+Math.random()*90;p.className='pt';p.textContent=em[k%em.length];
   p.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist-30}px;--r:${Math.random()*360}deg`;document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
  toast('Call korchi: '+n);
 });
});
file.addEventListener('change',()=>{
 const f=file.files[0];if(!f||!target)return;
 const rd=new FileReader(),card=target;
 rd.onload=()=>{const im=new Image();im.onload=()=>{
  const S=260,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),m=Math.min(im.width,im.height);
  x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
  const u=c.toDataURL('image/jpeg',.82);setPic(card,u);
  toast(store.set('pic-'+card.dataset.id,u)?'Photo add hoyeche ✓':'Photo dekhano hocche, kintu save hoyni (jayga kom)');
 };im.src=rd.result};rd.readAsDataURL(f);
});
const q=document.getElementById('q'),cnt=document.getElementById('cnt'),empty=document.getElementById('empty');
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();let n=0;
 grid.querySelectorAll('.card').forEach(c=>{const ok=c.dataset.s.includes(v);c.classList.toggle('hide',!ok);if(ok)n++});
 cnt.textContent=n;empty.style.display=n?'none':'block'});
</script>
</body>
</html>
