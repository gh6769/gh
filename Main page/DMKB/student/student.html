<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Our Contacts | Friends & Members</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #07111f;
    --cyan: #48dcff;
    --text: #eef7ff;
    --muted: #91a8bf;
    --border: #243c55;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
    background:
        radial-gradient(ellipse at 50% 0%, #102844 0%, transparent 48%),
        var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
}

button, input {
    font: inherit;
}

/* BACKGROUND */

.background-effects {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
}

.bg-orb {
    position: absolute;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.12;
}

.orb-one {
    top: 8%;
    left: -130px;
    background: #008cff;
}

.orb-two {
    right: -130px;
    bottom: 8%;
    background: #00e5ff;
}

/* PAGE */

.container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 25px 18px;
}

/* HEADER */

.page-header {
    text-align: center;
    margin-bottom: 22px;
    animation: headerEnter 0.6s ease both;
}

.header-icon {
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    margin: 0 auto 9px;
    border-radius: 16px;
    border: 1px solid #48dcff55;
    background: linear-gradient(145deg, #142d48, #0b1727);
    color: var(--cyan);
    font-size: 23px;
    box-shadow: 0 0 22px #00cfff15;
}

.page-header h1 {
    font-size: clamp(25px, 4vw, 36px);
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1.3;
    background: linear-gradient(90deg, #fff, #48dcff, #a5b9ff);
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
}

.page-header p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1.4px;
}

.header-line {
    width: 66px;
    height: 2px;
    margin: 12px auto 0;
    border-radius: 5px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}

/* SEARCH */

.search-box {
    width: 100%;
    max-width: 390px;
    min-height: 42px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 auto 22px;
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: #0b1929;
    color: var(--cyan);
    transition: border-color 0.25s, box-shadow 0.25s;
}

.search-box:focus-within {
    border-color: #48dcff99;
    box-shadow: 0 0 15px #00cfff12;
}

.search-box > i {
    flex-shrink: 0;
    font-size: 13px;
}

.search-box input {
    flex: 1;
    width: 100%;
    min-width: 0;
    outline: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 12px;
}

.search-box input::placeholder {
    color: #7188a0;
}

.search-end-icon {
    opacity: 0.55;
}

/* CONTACT GRID */

.contact-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
    gap: 13px;
}

/* CONTACT CARD */

.contact-card {
    min-width: 0;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: linear-gradient(
        145deg,
        rgba(17, 34, 54, 0.97),
        rgba(9, 20, 34, 0.98)
    );
    box-shadow: 0 4px 12px #00000014;
    animation: cardEnter 0.4s ease both;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}

.contact-card:hover {
    border-color: #48dcff70;
    background: linear-gradient(145deg, #13263d, #0b192a);
    box-shadow: 0 5px 17px #00cfff10;
}

.contact-card.dragon-active {
    border-color: var(--cyan);
    box-shadow: 0 0 15px #00cfff24, inset 0 0 10px #00cfff08;
}

/* PROFILE IMAGE */

.profile {
    width: 65px;
    height: 65px;
    flex: 0 0 65px;
    position: relative;
    z-index: 2;
    display: grid;
    place-items: center;
    padding: 3px;
    border-radius: 50%;
    overflow: hidden;
    cursor: pointer;
    background: linear-gradient(145deg, #48dcff, #167cff 60%, #987bff);
    box-shadow: 0 0 12px #00cfff18;
    transition: box-shadow 0.25s;
}

.profile:hover {
    box-shadow: 0 0 17px #00cfff35;
}

.profile img {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: center;
    border: 2px solid #0b1727;
    border-radius: 50%;
    transition: transform 0.28s ease, opacity 0.2s ease;
}

.profile.switching img {
    opacity: 0.15;
    transform: rotateY(90deg);
}

.profile > i {
    color: var(--cyan);
    font-size: 22px;
}

.profile img[hidden] {
    display: none;
}

/* CONTACT INFO */

.info {
    flex: 1;
    min-width: 0;
}

.info h2 {
    margin: 0 0 9px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.45;
    overflow-wrap: anywhere;
}

/* BUTTONS */

.buttons {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
}

.contact-btn {
    min-height: 29px;
    padding: 6px 8px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    border: 1px solid #2a415a;
    border-radius: 7px;
    background: #101f32;
    color: #dcecff;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.2;
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.2s, background 0.2s, border-color 0.2s;
}

.contact-btn i {
    font-size: 12px;
}

.contact-btn:hover {
    border-color: var(--cyan);
    background: #142b41;
    color: var(--cyan);
}

.contact-btn.call:hover {
    color: #8dffba;
    border-color: #45e88d;
}

.contact-btn.whatsapp:hover {
    color: #5effa2;
    border-color: #25d366;
}

.contact-btn.telegram:hover {
    color: #65caff;
    border-color: #229ed9;
}

.contact-btn.facebook:hover {
    color: #74aaff;
    border-color: #1877f2;
}

.contact-btn.x:hover {
    color: white;
    border-color: #aaa;
}

.contact-btn.imo:hover {
    color: #7bfff1;
    border-color: #00bfa5;
}

.contact-btn.instagram:hover {
    color: #ff8ad2;
    border-color: #e4405f;
}

.contact-btn.tiktok:hover {
    color: white;
    border-color: #ff4b82;
}

/* DRAGON ANIMATION */

.dragon-fx {
    position: absolute;
    z-index: 20;
    left: 35%;
    top: 50%;
    font-size: 35px;
    line-height: 1;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 0 6px #ff8b35);
    animation: dragonFly 1.65s cubic-bezier(.2, .7, .25, 1) forwards;
}

@keyframes dragonFly {
    0% {
        opacity: 0;
        transform: translate(-10%, 0) scale(0.25) rotate(-20deg);
    }
    15% {
        opacity: 1;
        transform: translate(0, -15px) scale(0.85) rotate(8deg);
    }
    45% {
        opacity: 1;
        transform: translate(30px, -50px) scale(1.15) rotate(-10deg);
    }
    75% {
        opacity: 0.9;
        transform: translate(65px, -90px) scale(0.9) rotate(12deg);
    }
    100% {
        opacity: 0;
        transform: translate(100px, -125px) scale(0.4) rotate(25deg);
    }
}

.dragon-spark {
    position: absolute;
    z-index: 19;
    left: var(--sx);
    top: var(--sy);
    width: var(--ss);
    height: var(--ss);
    border-radius: 50%;
    background: var(--spark-color);
    box-shadow: 0 0 8px var(--spark-color);
    pointer-events: none;
    animation: sparkFly 0.9s ease-out forwards;
}

@keyframes sparkFly {
    from {
        opacity: 1;
        transform: translate(0, 0) scale(1);
    }
    to {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0.1);
    }
}

/* EMPTY RESULT */

.empty-message {
    padding: 25px 10px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

.empty-message i {
    margin-right: 6px;
    color: var(--cyan);
}

/* FOOTER */

.page-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 25px 0 5px;
    color: #8298ae;
    font-size: 11px;
    letter-spacing: 0.7px;
}

.footer-heart {
    color: #ff6b9d;
}

/* PAGE ANIMATIONS */

@keyframes headerEnter {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(7px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MOBILE */

@media (max-width: 650px) {
    .container {
        padding: 20px 12px;
    }

    .contact-list {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .contact-card {
        padding: 11px;
        gap: 11px;
        border-radius: 13px;
    }

    .profile {
        width: 59px;
        height: 59px;
        flex-basis: 59px;
    }

    .info h2 {
        font-size: 13px;
        margin-bottom: 7px;
    }

    .contact-btn {
        min-height: 28px;
        padding: 6px 7px;
        font-size: 10px;
    }
}

@media (max-width: 350px) {
    .container {
        padding-right: 9px;
        padding-left: 9px;
    }

    .contact-card {
        gap: 9px;
        padding: 9px;
    }

    .profile {
        width: 51px;
        height: 51px;
        flex-basis: 51px;
    }

    .info h2 {
        font-size: 12px;
    }

    .contact-btn {
        padding: 5px 6px;
        font-size: 9px;
    }

    .contact-btn i {
        font-size: 11px;
    }
}

/* THE GOODBYE CREW */

.goodbye-section {
    margin-top: 34px;
    padding: 25px 18px 22px;
    border: 1px solid #29445f;
    border-radius: 20px;
    background:
        radial-gradient(ellipse at 50% 0%, #183b5c88, transparent 65%),
        linear-gradient(145deg, #0e1d30, #091523);
    box-shadow: 0 8px 28px #00000025;
    overflow: hidden;
    position: relative;
}

.goodbye-heading {
    text-align: center;
    margin-bottom: 22px;
}

.goodbye-heading h2 {
    display: inline-block;
    font-size: clamp(23px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: 1.2px;
    background: linear-gradient(
        90deg,
        #ffffff,
        #48dcff,
        #b59aff,
        #ff9bc9,
        #ffffff
    );
    background-size: 250% auto;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    animation: goodbyeShine 4s linear infinite, goodbyeFloat 3s ease-in-out infinite;
    text-shadow: 0 0 24px #48dcff20;
}

.goodbye-heading p {
    margin-top: 7px;
    color: #91a8bf;
    font-size: 11px;
    letter-spacing: 1.5px;
}

.goodbye-line {
    width: 90px;
    height: 2px;
    margin: 13px auto 0;
    border-radius: 10px;
    background: linear-gradient(90deg, transparent, #48dcff, #b59aff, transparent);
    box-shadow: 0 0 12px #48dcff80;
}

.goodbye-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}

.goodbye-card {
    min-height: 125px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 9px;
    padding: 16px 10px;
    text-align: center;
    border: 1px solid #2a4662;
    border-radius: 14px;
    background: linear-gradient(145deg, #142943, #0c1a2b);
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    animation: goodbyeCardEnter .7s ease both;
}

.goodbye-card:nth-child(2) { animation-delay: .12s; }
.goodbye-card:nth-child(3) { animation-delay: .24s; }
.goodbye-card:nth-child(4) { animation-delay: .36s; }

.goodbye-card:hover {
    transform: translateY(-6px);
    border-color: #48dcff;
    box-shadow: 0 8px 22px #00cfff18;
}

.goodbye-card i {
    font-size: 24px;
    color: #61dcff;
    filter: drop-shadow(0 0 8px #48dcff55);
}

.goodbye-card h3 {
    color: #eef7ff;
    font-size: 12px;
    font-weight: 700;
}

.goodbye-card p {
    color: #91a8bf;
    font-size: 10px;
    line-height: 1.6;
}

@keyframes goodbyeShine {
    from { background-position: 0% center; }
    to { background-position: 250% center; }
}

@keyframes goodbyeFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

@keyframes goodbyeCardEnter {
    from { opacity: 0; transform: translateY(16px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 650px) {
    .goodbye-section {
        margin-top: 27px;
        padding: 21px 12px 16px;
    }

    .goodbye-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
    }

    .goodbye-card {
        min-height: 118px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .contact-card,
    .page-header,
    .dragon-fx,
    .dragon-spark,
    .goodbye-heading h2,
    .goodbye-card {
        animation-duration: 0.01ms !important;
    }

    .contact-card,
    .profile img,
    .contact-btn,
    .goodbye-card {
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

/* =====================================================
   BANGLADESH PHONE NUMBERS
===================================================== */

function internationalNumber(number) {
    if (!number) return "";

    const clean = String(number).replace(/\D/g, "");

    if (clean.length === 11 && clean.startsWith("01")) {
        return "88" + clean.substring(1);
    }

    return clean;
}


/* =====================================================
   CALL / WHATSAPP / TELEGRAM BUTTONS
===================================================== */

function createButton(type, number) {
    if (!number) return "";

    if (String(number).includes("*")) {
        return `
            <span class="contact-btn">
                <i class="fa-solid fa-lock"></i>
                ${type}
            </span>
        `;
    }

    const intl = internationalNumber(number);

    let link = "";
    let icon = "";
    let className = "";

    if (type === "Call") {
        link = `tel:${number}`;
        icon = "fa-solid fa-phone";
        className = "call";
    }

    if (type === "WhatsApp") {
        link = `https://wa.me/${intl}`;
        icon = "fa-brands fa-whatsapp";
        className = "whatsapp";
    }

    if (type === "Telegram") {
        link = `https://t.me/+${intl}`;
        icon = "fa-brands fa-telegram";
        className = "telegram";
    }

    return `
        <a class="contact-btn ${className}"
           href="${link}"
           target="_blank"
           rel="noopener noreferrer">
            <i class="${icon}"></i>
            ${type}
        </a>
    `;
}


/* =====================================================
   SOCIAL BUTTONS
===================================================== */

function createSocialButton(type, value) {
    if (!value) return "";

    let link = "";
    let icon = "";
    let className = "";

    if (type === "Facebook") {
        link = value;
        icon = "fa-brands fa-facebook";
        className = "facebook";
    }

    if (type === "X") {
        link = value;
        icon = "fa-brands fa-x-twitter";
        className = "x";
    }

    if (type === "IMO") {
        link = `https://imo.im/${encodeURIComponent(value)}`;
        icon = "fa-solid fa-comment";
        className = "imo";
    }

    if (type === "Instagram") {
        link = value;
        icon = "fa-brands fa-instagram";
        className = "instagram";
    }

    if (type === "TikTok") {
        link = value;
        icon = "fa-brands fa-tiktok";
        className = "tiktok";
    }

    return `
        <a class="contact-btn ${className}"
           href="${link}"
           target="_blank"
           rel="noopener noreferrer">
            <i class="${icon}"></i>
            ${type}
        </a>
    `;
}


/* =====================================================
   DRAGON ANIMATION
===================================================== */

function launchDragon(card) {
    card.classList.remove("dragon-active");
    void card.offsetWidth;
    card.classList.add("dragon-active");

    const dragon = document.createElement("span");
    dragon.className = "dragon-fx";
    dragon.textContent = "🐉";
    dragon.setAttribute("aria-hidden", "true");
    card.appendChild(dragon);

    const colors = ["#49dcff", "#9b83ff", "#ff9b55", "#ffffff"];

    for (let i = 0; i < 12; i++) {
        const spark = document.createElement("span");
        spark.className = "dragon-spark";

        spark.style.setProperty("--sx", `${25 + Math.random() * 50}%`);
        spark.style.setProperty("--sy", `${35 + Math.random() * 35}%`);
        spark.style.setProperty("--ss", `${3 + Math.random() * 5}px`);
        spark.style.setProperty("--dx", `${Math.random() * 120 - 60}px`);
        spark.style.setProperty("--dy", `${-30 - Math.random() * 90}px`);

        spark.style.setProperty(
            "--spark-color",
            colors[Math.floor(Math.random() * colors.length)]
        );

        card.appendChild(spark);
        setTimeout(() => spark.remove(), 1000);
    }

    setTimeout(() => dragon.remove(), 1700);
    setTimeout(() => card.classList.remove("dragon-active"), 900);
}


/* =====================================================
   CREATE CONTACT CARD
===================================================== */

function createContactCard(person, index) {
    const card = document.createElement("article");
    card.className = "contact-card";
    card.style.animationDelay = `${Math.min(index * 0.04, 0.5)}s`;

    /* PROFILE */

    const profile = document.createElement("div");
    profile.className = "profile";
    profile.title = person.profile2
        ? "Click to change picture"
        : "Profile picture";

    const img = document.createElement("img");
    img.alt = person.name;
    img.width = 65;
    img.height = 65;
    img.loading = "lazy";
    img.decoding = "async";
    img.src = person.profile;

    const fallback = document.createElement("i");
    fallback.className = "fa-solid fa-user";
    fallback.style.display = "none";

    img.addEventListener("error", () => {
        img.style.display = "none";
        fallback.style.display = "block";
    });

    img.addEventListener("load", () => {
        img.style.display = "block";
        fallback.style.display = "none";
    });

    profile.append(img, fallback);

    /* NAME AND BUTTONS */

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("h2");
    name.textContent = person.name;

    const buttons = document.createElement("div");
    buttons.className = "buttons";

    buttons.innerHTML = `
        ${createButton("Call", person.call)}
        ${createButton("WhatsApp", person.whatsapp)}
        ${createButton("Telegram", person.telegram)}
        ${createSocialButton("Facebook", person.facebook)}
        ${createSocialButton("X", person.x)}
        ${createSocialButton("IMO", person.imo)}
        ${createSocialButton("Instagram", person.instagram)}
        ${createSocialButton("TikTok", person.tiktok)}
    `;

    info.append(name, buttons);
    card.append(profile, info);

    /* SECOND PROFILE IMAGE */

    let showingSecond = false;
    let switching = false;

    profile.addEventListener("click", () => {
        launchDragon(card);

        if (!person.profile2 || switching) return;

        const nextImage = showingSecond
            ? person.profile
            : person.profile2;

        const imageCheck = new Image();

        switching = true;
        profile.classList.add("switching");

        imageCheck.onload = () => {
            img.src = nextImage;
            showingSecond = !showingSecond;
            img.style.display = "block";
            fallback.style.display = "none";

            profile.classList.remove("switching");
            switching = false;
        };

        imageCheck.onerror = () => {
            profile.classList.remove("switching");
            switching = false;
            console.warn("Profile image not found:", nextImage);
        };

        imageCheck.src = nextImage;
    });

    /* CLICK CARD FOR DRAGON */

    card.addEventListener("click", event => {
        if (event.target.closest("a")) return;
        if (event.target.closest(".profile")) return;

        launchDragon(card);
    });

    return card;
}
