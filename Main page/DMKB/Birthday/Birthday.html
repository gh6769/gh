<style>
*{

body{

}

.bg-animation{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.bg-animation span{
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white,0 0 20px #8b5cf6;
    animation:float 12s linear infinite;
    opacity:.7;
}

.bg-animation span:nth-child(1){left:10%;top:90%;animation-duration:12s;}
.bg-animation span:nth-child(2){left:20%;top:80%;animation-duration:16s;width:5px;height:5px;}
.bg-animation span:nth-child(3){left:35%;top:95%;animation-duration:14s;}
.bg-animation span:nth-child(4){left:50%;top:85%;animation-duration:18s;}
.bg-animation span:nth-child(5){left:65%;top:90%;animation-duration:13s;}
.bg-animation span:nth-child(6){left:75%;top:75%;animation-duration:17s;}
.bg-animation span:nth-child(7){left:88%;top:92%;animation-duration:15s;}
.bg-animation span:nth-child(8){left:45%;top:70%;animation-duration:20s;}

@keyframes float{
    0%{transform:translateY(100vh) scale(0);opacity:0;}
    20%{opacity:1;}
    80%{opacity:.8;}
    100%{transform:translateY(-120vh) scale(1.5);opacity:0;}
}

.header{
    text-align:center;
    padding:55px 20px 35px;
}

.cake{
    font-size:65px;
    display:inline-block;
    animation:cakeFloat 2s ease-in-out infinite;
    filter:drop-shadow(0 0 15px rgba(255,255,255,.5));
}

@keyframes cakeFloat{
    0%,100%{transform:translateY(0) rotate(-5deg);}
    50%{transform:translateY(-12px) rotate(5deg);}
}

.header h1{
    margin-top:10px;
    font-size:clamp(32px,6vw,65px);
    font-weight:900;
    background:linear-gradient(90deg,#ff6ec7,#8b5cf6,#38bdf8,#ff6ec7);
    background-size:300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradientMove 5s linear infinite;
}

@keyframes gradientMove{
    0%{background-position:0%;}
    100%{background-position:300%;}
}

.header p{
    margin-top:12px;
    color:#d7d4e8;
    font-size:17px;
}

.live-date{
    display:inline-block;

    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(10px);
    color:#c4b5fd;
}

.birthday-section{

}

.section-title{

    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:30px;
}

.section-title h2{font-size:30px;}

.section-title span{

}

@keyframes spinEmoji{
    from{transform:rotate(-15deg) scale(1);}
    to{transform:rotate(15deg) scale(1.2);}
}

.birthday-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.birthday-card{
    position:relative;
    padding:25px;
    border-radius:25px;
    overflow:hidden;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    box-shadow:0 10px 40px rgba(0,0,0,.3),inset 0 0 30px rgba(255,255,255,.02);
    transition:.4s ease;
}

.birthday-card::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:#8b5cf6;
    filter:blur(80px);
    opacity:.18;
    top:-80px;
    right:-70px;
}

.birthday-card::after{

    padding:2px;

    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
    transition:.4s;
    pointer-events:none;
}

.birthday-card:hover{

.birthday-card:hover::after{opacity:1;}

/* ==========================================
   MONTHS
========================================== */

const monthNames = [
    "January","February","March","April",
    "May","June","July","August",
    "September","October","November","December"
];

let lastOrder = "";
let lastDay = new Date().toDateString();
let birthdayCelebrated = new Set();


/* ==========================================
   GET BIRTHDAY INFO
========================================== */

function getBirthdayInfo(birthday){

    const parts = birthday.trim().split(/\s+/);

    return {
        day:parseInt(parts[0],10),
        month:monthNames.indexOf(parts[1])
    };
}


/* ==========================================
   GET NEXT BIRTHDAY
========================================== */

function getNextBirthday(birthday){

    const info = getBirthdayInfo(birthday);
    const now = new Date();

    let year = now.getFullYear();

    let nextBirthday = new Date(
        year,info.month,info.day,0,0,0,0
    );

    const isToday =
        now.getMonth() === info.month &&
        now.getDate() === info.day;

    if(nextBirthday < now && !isToday){

        nextBirthday = new Date(
            year+1,info.month,info.day,0,0,0,0
        );

    }

    return nextBirthday;
}


/* ==========================================
   FORMAT DATE
========================================== */

function formatDate(date){

    return date.toLocaleDateString("bn-BD",{
        day:"numeric",
        month:"long"
    });
}


/* ==========================================
   CREATE CARD
========================================== */

function createCard(friend,index,isNext){

    const birthday = getNextBirthday(friend.birthday);

    const card = document.createElement("div");

    card.className = "birthday-card";

    const info = getBirthdayInfo(friend.birthday);
    const now = new Date();

    if(
        now.getMonth() === info.month &&
        now.getDate() === info.day
    ){
        card.classList.add("birthday-today");
    }

    if(isNext){
        card.classList.add("next-birthday");
    }

    card.dataset.birthday = birthday.getTime();
    card.dataset.friendIndex = index;

    card.innerHTML = `

        <div class="card-number">
            ${String(index+1).padStart(2,"0")}
        </div>

        ${
            isNext
            ? '<div class="next-badge">⭐ NEXT BIRTHDAY</div>'
            : ''
        }

        <div class="avatar">
            <img
                src="${friend.image}"
                alt="${friend.name}"
                onerror="this.onerror=null;this.src='images/default.jpg';"
            >
        </div>

        <h2 class="friend-name">${friend.name}</h2>

        <p class="birthday-date">
            🎂 ${formatDate(birthday)}
        </p>

        <div class="countdown">

            <div class="time-box">
                <span class="time-number days">00</span>
                <span class="time-label">দিন</span>
            </div>

            <div class="time-box">
                <span class="time-number hours">00</span>
                <span class="time-label">ঘণ্টা</span>
            </div>

            <div class="time-box">
                <span class="time-number minutes">00</span>
                <span class="time-label">মিনিট</span>
            </div>

            <div class="time-box">
                <span class="time-number seconds">00</span>
                <span class="time-label">সেকেন্ড</span>
            </div>

        </div>
    `;

    return card;
}

            ...friend,
            originalIndex:index,
            nextDate:getNextBirthday(friend.birthday)
        }))
        .sort((a,b)=>a.nextDate-b.nextDate);

}


/* ==========================================
   RENDER BIRTHDAYS
========================================== */

function renderBirthdays(){

    const list = document.getElementById("birthdayList");

    if(!list) return;

    const sortedFriends = getSortedFriends();

    const newOrder = sortedFriends
        .map(friend=>friend.originalIndex)
        .join("|");

    if(
        newOrder === lastOrder &&
        list.children.length > 0
    ){
        return;
    }

    lastOrder = newOrder;

    list.innerHTML = "";

    sortedFriends.forEach((friend,index)=>{

        const card = createCard(
            friend,
            friend.originalIndex,
            index === 0
        );

        list.appendChild(card);

    });

}


/* ==========================================
   UPDATE COUNTDOWN
========================================== */

function updateCountdown(){

    const now = new Date();
    const nowTime = now.getTime();

    const cards = document.querySelectorAll(".birthday-card");

    cards.forEach(card=>{

        const friendIndex = Number(card.dataset.friendIndex);
        const friend = friends[friendIndex];

        if(!friend) return;

        const info = getBirthdayInfo(friend.birthday);

        const isBirthdayToday =
            now.getMonth() === info.month &&
            now.getDate() === info.day;

        if(isBirthdayToday){

            card.classList.add("birthday-today");

            const countdown = card.querySelector(".countdown");

            if(countdown){
                countdown.style.display = "none";
            }

            let happyBirthday =
                card.querySelector(".happy-birthday");

            if(!happyBirthday){

                happyBirthday = document.createElement("div");

                happyBirthday.className = "happy-birthday";

                happyBirthday.innerHTML =
                    "🎉🎂 Happy Birthday! 🎂🎉";

                if(countdown){

                    countdown.parentNode.insertBefore(
                        happyBirthday,countdown
                    );

                }else{

                    card.appendChild(happyBirthday);

                }
            }

            const dateElement =
                card.querySelector(".birthday-date");

            if(dateElement){
                dateElement.innerHTML =
                    `🎂 ${formatDate(now)}`;
            }

            const celebrationKey =
                friendIndex+"-"+now.getFullYear();

            if(!birthdayCelebrated.has(celebrationKey)){

                birthdayCelebrated.add(celebrationKey);

                createConfetti();

            }

            return;
        }

        card.classList.remove("birthday-today");

        const happyBirthday =
            card.querySelector(".happy-birthday");

        if(happyBirthday){
            happyBirthday.remove();
        }

        const countdown = card.querySelector(".countdown");

        if(countdown){
            countdown.style.display = "grid";
        }

        const nextBirthday =
            getNextBirthday(friend.birthday);

        card.dataset.birthday = nextBirthday.getTime();

        const difference =
            nextBirthday.getTime()-nowTime;

        const days = Math.floor(
            difference/(1000*60*60*24)
        );

        const hours = Math.floor(
            (difference%(1000*60*60*24))/(1000*60*60)
        );

        const minutes = Math.floor(
            (difference%(1000*60*60))/(1000*60)
        );

        const seconds = Math.floor(
            (difference%(1000*60))/1000
        );

        const daysElement = card.querySelector(".days");
        const hoursElement = card.querySelector(".hours");
        const minutesElement = card.querySelector(".minutes");
        const secondsElement = card.querySelector(".seconds");

        if(daysElement){
            daysElement.textContent =
                String(days).padStart(2,"0");
        }

        if(hoursElement){
            hoursElement.textContent =
                String(hours).padStart(2,"0");
        }

        if(minutesElement){
            minutesElement.textContent =
                String(minutes).padStart(2,"0");
        }

        if(secondsElement){
            secondsElement.textContent =
                String(seconds).padStart(2,"0");
        }

    });

}


/* ==========================================
   TODAY'S DATE
========================================== */

function showTodayDate(){

    const today = new Date();

    const element =
        document.getElementById("todayDate");

    if(!element) return;

    element.textContent =
        "📅 আজ: "+
        today.toLocaleDateString("bn-BD",{
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        });

}


/* ==========================================
   CHECK NEW DAY
========================================== */

function checkNewDay(){

    const today = new Date();

    const todayString = today.toDateString();

    if(todayString !== lastDay){

        lastDay = todayString;

        lastOrder = "";

        renderBirthdays();

    }

    showTodayDate();
}


/* ==========================================
   CONFETTI
========================================== */

function createConfetti(){

    const container =
        document.getElementById("confetti");

    if(!container) return;

    for(let i=0;i<70;i++){

        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.style.left =
            Math.random()*100+"vw";

        piece.style.width =
            Math.random()*8+5+"px";

        piece.style.height =
            Math.random()*12+8+"px";

        piece.style.background =
            `hsl(${Math.random()*360},90%,60%)`;

        piece.style.animationDuration =
            Math.random()*2+3+"s";

        piece.style.animationDelay =
            Math.random()*.5+"s";

        container.appendChild(piece);

        setTimeout(()=>{
            piece.remove();
        },6000);

    }

}


/* ==========================================
   WEBSITE START
========================================== */

renderBirthdays();

showTodayDate();

updateCountdown();

setInterval(()=>{
    updateCountdown();
},1000);

setInterval(()=>{
    checkNewDay();
},10000);

</script>
