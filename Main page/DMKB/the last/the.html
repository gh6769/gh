```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Last Dance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: url("The.png") center center / cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
}

.container {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 95%;
}

h1 {
    font-size: clamp(35px, 7vw, 85px);
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 0 0 15px #00eaff,
                 0 0 30px #00eaff;
    animation: glow 2s infinite alternate;
}

.message {
    font-size: clamp(15px, 2vw, 22px);
    margin-top: 20px;
    letter-spacing: 3px;
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 45px;
    flex-wrap: wrap;
}

.box {
    min-width: 110px;
    padding: 20px 15px;
    border: 2px solid #00eaff;
    border-radius: 15px;
    background: rgba(0, 0, 0, 0.45);
    box-shadow: 0 0 15px #00eaff,
                inset 0 0 15px rgba(0, 234, 255, 0.2);
    animation: borderGlow 2s infinite alternate;
}

.box span {
    display: block;
    font-size: clamp(35px, 5vw, 55px);
    font-weight: bold;
}

.box p {
    margin-top: 8px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #00eaff;
}

@keyframes glow {
    from {
        text-shadow: 0 0 10px #00eaff;
    }
    to {
        text-shadow: 0 0 25px #00eaff,
                     0 0 45px #00eaff;
    }
}

@keyframes borderGlow {
    from {
        box-shadow: 0 0 10px #00eaff;
    }
    to {
        box-shadow: 0 0 25px #00eaff,
                    inset 0 0 15px rgba(0, 234, 255, 0.3);
    }
}

@media (max-width: 600px) {
    .countdown {
        gap: 10px;
    }

    .box {
        min-width: 75px;
        padding: 15px 8px;
    }

    .box p {
        font-size: 10px;
    }

    h1 {
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <h1>The Last Dance</h1>

    <div class="message">
        THE MOMENT WE HAVE BEEN WAITING FOR
    </div>

    <div class="countdown">

        <div class="box">
            <span id="days">00</span>
            <p>DAYS</p>
        </div>

        <div class="box">
            <span id="hours">00</span>
            <p>HOURS</p>
        </div>

        <div class="box">
            <span id="minutes">00</span>
            <p>MINUTES</p>
        </div>

        <div class="box">
            <span id="seconds">00</span>
            <p>SECONDS</p>
        </div>

    </div>

</div>

<script>

// Target Date: 7 November 2026, 5:00 PM
const targetDate = new Date("2026-11-07T17:00:00").getTime();

function updateCountdown() {

    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance <= 0) {

        document.getElementById("days").innerHTML = "00";
        document.getElementById("hours").innerHTML = "00";
        document.getElementById("minutes").innerHTML = "00";
        document.getElementById("seconds").innerHTML = "00";

        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("days").innerHTML = String(days).padStart(2, "0");
    document.getElementById("hours").innerHTML = String(hours).padStart(2, "0");
    document.getElementById("minutes").innerHTML = String(minutes).padStart(2, "0");
    document.getElementById("seconds").innerHTML = String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
