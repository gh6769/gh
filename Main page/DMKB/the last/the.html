
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#000000">

    <title>The Last Dance Countdown</title>

    <style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background-image: url("The.png");

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    position: relative;
}


/* =========================
   DARK OVERLAY
========================= */

.overlay {
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.38),
            rgba(0, 0, 0, 0.58)
        );

    z-index: 1;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 40px 20px;
}


/* =========================
   MESSAGE
========================= */

.message {
    width: min(100%, 1000px);

    text-align: center;
    color: #ffffff;

    font-size: clamp(22px, 2.6vw, 38px);

    line-height: 1.45;
    font-weight: 400;

    text-shadow:
        0 3px 8px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 0, 0, 0.7);

    margin-bottom: 42px;
}

.message p {
    margin-bottom: 7px;
}

.message .highlight {
    color: #ffc45c;
    font-weight: 500;
}


/* =========================
   COUNTDOWN
========================= */

.countdown {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 15px;
}


/* =========================
   TIME BOX
========================= */

.time-box {
    width: 150px;
    height: 145px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    border: 2px solid rgba(255, 174, 50, 0.9);

    border-radius: 20px;

    background: rgba(0, 0, 0, 0.48);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 0 12px rgba(255, 165, 0, 0.45),
        inset 0 0 20px rgba(255, 165, 0, 0.06);

    transition: 0.3s ease;
}

.time-box:hover {
    transform: translateY(-5px);

    box-shadow:
        0 0 25px rgba(255, 165, 0, 0.7),
        inset 0 0 25px rgba(255, 165, 0, 0.1);
}


/* Number */

.time-box span {
    color: white;

    font-size: 68px;
    line-height: 1;

    font-weight: 700;
    letter-spacing: 2px;

    text-shadow:
        0 3px 10px rgba(0, 0, 0, 0.9),
        0 0 15px rgba(255, 255, 255, 0.15);
}


/* Label */

.time-box small {
    margin-top: 12px;

    color: #ffffff;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 4px;
    opacity: 0.9;
}


/* =========================
   COLON
========================= */

.colon {
    color: white;

    font-size: 60px;
    font-weight: bold;

    text-shadow:
        0 0 10px rgba(255, 255, 255, 0.4);

    margin-top: -15px;
}


/* =========================
   DATE
========================= */

.date {
    margin-top: 48px;

    color: white;

    font-size: clamp(18px, 2vw, 27px);

    text-align: center;

    text-shadow:
        0 3px 8px black,
        0 0 15px black;

    letter-spacing: 0.5px;
}


/* =========================
   TITLE
========================= */

.title {
    margin-top: 8px;

    color: #ffc04f;

    font-size: clamp(28px, 3vw, 42px);

    font-style: italic;

    font-family: Georgia, "Times New Roman", serif;

    text-shadow:
        0 3px 10px black,
        0 0 18px rgba(255, 170, 40, 0.35);
}


/* =========================
   FINISHED
========================= */

.countdown.finished .time-box {
    border-color: rgba(255, 174, 50, 0.5);
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 900px) {

    .container {
        padding: 30px 18px;
    }

    .message {
        font-size: 28px;
        margin-bottom: 35px;
    }

    .time-box {
        width: 125px;
        height: 125px;
    }

    .time-box span {
        font-size: 56px;
    }

    .colon {
        font-size: 48px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    body {
        background-position: center center;
    }

    .container {
        padding: 25px 12px 30px;
        justify-content: center;
    }

    /* Message */

    .message {
        width: 100%;

        font-size: 22px;
        line-height: 1.5;

        margin-bottom: 28px;
    }

    .message p {
        margin-bottom: 5px;
    }

    /* Countdown */

    .countdown {
        width: 100%;
        gap: 5px;
    }

    /* Time boxes */

    .time-box {
        width: 22vw;
        max-width: 90px;

        height: 100px;

        border-radius: 14px;
    }

    .time-box span {
        font-size: clamp(34px, 9vw, 48px);
        letter-spacing: 0;
    }

    .time-box small {
        margin-top: 8px;

        font-size: 8px;
        letter-spacing: 1.5px;
    }

    /* Colon */

    .colon {
        font-size: 32px;
        margin-top: -10px;
    }

    /* Date */

    .date {
        margin-top: 32px;
        font-size: 17px;
    }

    /* Title */

    .title {
        font-size: 30px;
        margin-top: 6px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

    .container {
        padding-left: 8px;
        padding-right: 8px;
    }

    .message {
        font-size: 18px;
        line-height: 1.45;
        margin-bottom: 22px;
    }

    .time-box {
        width: 21vw;
        height: 82px;
        border-radius: 11px;
    }

    .time-box span {
        font-size: 30px;
    }

    .time-box small {
        font-size: 6px;
        letter-spacing: 1px;
        margin-top: 6px;
    }

    .colon {
        font-size: 25px;
    }

    .date {
        margin-top: 25px;
        font-size: 14px;
    }

    .title {
        font-size: 25px;
    }

}

    </style>

</head>


<body>


    <!-- Dark Overlay -->

    <div class="overlay"></div>


    <!-- Main Content -->

    <main class="container">


        <!-- Message -->

        <section class="message">

            <p>
                When the clock strikes noon,
                everything may look exactly the same...
            </p>

            <p>
                Except, I won't be there.
            </p>

            <p>
                Some goodbyes are never spoken.
            </p>

            <p class="highlight">
                Some stories end without a final line.
            </p>

        </section>


        <!-- Countdown -->

        <section class="countdown" id="countdown">


            <div class="time-box">

                <span id="days">00</span>

                <small>DAYS</small>

            </div>


            <div class="colon">:</div>


            <div class="time-box">

                <span id="hours">00</span>

                <small>HOURS</small>

            </div>


            <div class="colon">:</div>


            <div class="time-box">

                <span id="minutes">00</span>

                <small>MINUTES</small>

            </div>


            <div class="colon">:</div>


            <div class="time-box">

                <span id="seconds">00</span>

                <small>SECONDS</small>

            </div>


        </section>


        <!-- Date -->

        <div class="date">

            November 7 | Saturday | 5:00 PM

        </div>


        <!-- Title -->

        <div class="title">

            The Last Dance

        </div>


    </main>


    <!-- JavaScript -->

    <script>


        /* =========================
           TARGET DATE & TIME

           November 7, 2026
           5:00 PM
        ========================== */


        const targetDate =
            new Date("2026-11-07T17:00:00").getTime();



        /* =========================
           UPDATE COUNTDOWN
        ========================== */


        function updateCountdown() {


            const now =
                new Date().getTime();


            const distance =
                targetDate - now;



            /* Time's Up */


            if (distance <= 0) {


                document.getElementById("days").innerText = "00";

                document.getElementById("hours").innerText = "00";

                document.getElementById("minutes").innerText = "00";

                document.getElementById("seconds").innerText = "00";


                document.getElementById("countdown").classList.add("finished");


                return;

            }



            /* Calculate Time */


            const days =
                Math.floor(
                    distance /
                    (1000 * 60 * 60 * 24)
                );


            const hours =
                Math.floor(
                    (distance %
                    (1000 * 60 * 60 * 24)) /
                    (1000 * 60 * 60)
                );


            const minutes =
                Math.floor(
                    (distance %
                    (1000 * 60 * 60)) /
                    (1000 * 60)
                );


            const seconds =
                Math.floor(
                    (distance %
                    (1000 * 60)) /
                    1000
                );



            /* Show Countdown */


            document.getElementById("days").innerText =
                String(days).padStart(2, "0");


            document.getElementById("hours").innerText =
                String(hours).padStart(2, "0");


            document.getElementById("minutes").innerText =
                String(minutes).padStart(2, "0");


            document.getElementById("seconds").innerText =
                String(seconds).padStart(2, "0");


        }



        /* =========================
           START
        ========================== */


        updateCountdown();



        /* Update Every Second */


        setInterval(updateCountdown, 1000);


    </script>


</body>

</html>
