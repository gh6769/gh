<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Last Dance</title>

<style>

/* =========================
   GLOBAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --text: #f4f8fb;
    --muted: #d3dde6;
    --glow: #6ee7e0;
    --blue: #6aa8ff;
    --glass-border: rgba(160, 240, 235, .55);
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: "Roboto", "Segoe UI", Arial, Helvetica, sans-serif;
    color: var(--text);
    overflow-x: hidden;

    background:
        radial-gradient(60% 45% at 50% 95%, rgba(80, 150, 220, .45), transparent 70%),
        linear-gradient(180deg, #8e98a6, #3f5266);
    background-attachment: fixed;
}


/* =========================
   RAIN BACKGROUND
========================= */

.bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
}

.bg span {
    position: absolute;
    top: 0;

    /* left, width, height, duration, delay are set by the script below */
    border-radius: 50% 50% 50% 50% / 20% 20% 80% 80%;

    background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, .85)
    );

    animation-name: rain;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

@keyframes rain {
    0% {
        transform: translateY(-15vh);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh);
        opacity: 0;
    }
}


/* =========================
   HEADER
========================= */

header {
    text-align: center;
    padding: 55px 15px 30px;
}

header h1 {
    font-size: clamp(32px, 7vw, 70px);
    letter-spacing: 8px;
    font-weight: 700;

    color: var(--text);

    text-shadow:
        0 0 12px rgba(110, 231, 224, .8),
        0 0 30px rgba(110, 231, 224, .4);
}

header p {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    letter-spacing: 2px;
}


/* =========================
   CONTAINER (BIG GLASS PANEL)
========================= */

.container {
    width: min(1100px, 94%);
    margin: auto;

    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 25px;
    padding: 35px;
    margin-bottom: 40px;

    border-radius: 36px;
    border: 1.5px solid var(--glass-border);

    background: linear-gradient(
        160deg,
        rgba(255, 255, 255, .18),
        rgba(255, 255, 255, .06)
    );

    backdrop-filter: blur(18px) saturate(1.2);
    -webkit-backdrop-filter: blur(18px) saturate(1.2);

    box-shadow:
        0 0 40px rgba(110, 231, 224, .25),
        inset 0 0 40px rgba(255, 255, 255, .08);
}


/* =========================
   CARD
========================= */

.card {
    position: relative;
    min-height: 190px;
    padding: 30px 20px;

    text-decoration: none;
    color: var(--text);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    overflow: hidden;

    border-radius: 26px;
    border: 1.5px solid var(--glass-border);

    background: rgba(255, 255, 255, .12);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
        0 0 30px rgba(110, 231, 224, .3),
        inset 0 0 24px rgba(255, 255, 255, .08);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
}


/* HOVER */

.card:hover {
    transform: translateY(-8px);
    border-color: var(--glow);

    box-shadow:
        0 0 15px var(--glow),
        0 0 40px rgba(110, 231, 224, .45),
        inset 0 0 24px rgba(255, 255, 255, .12);
}

.card:active {
    transform: scale(.97);
}

.card:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 4px;
}


/* ICON */

.icon {
    width: 65px;
    height: 65px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    border-radius: 50%;

    background: rgba(255, 255, 255, .1);

    border: 2px solid var(--glow);

    box-shadow:
        0 0 14px rgba(110, 231, 224, .45),
        inset 0 0 10px rgba(110, 231, 224, .15);
}


/* TEXT */

.card h2 {
    margin-top: 15px;
    font-size: clamp(18px, 3vw, 27px);
    font-weight: 700;
    letter-spacing: 1px;

    text-shadow: 0 0 10px rgba(110, 231, 224, .6);
}

.card p {
    margin-top: 7px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
}


/* FOOTER */

footer {
    text-align: center;
    padding: 15px 10px 30px;

    color: var(--muted);
    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header {
        padding-top: 35px;
    }

    header h1 {
        letter-spacing: 4px;
    }

    .container {
        width: 94%;
        gap: 12px;
        padding: 14px;
        border-radius: 24px;
    }

    .card {
        min-height: 155px;
        padding: 18px 8px;

        border-radius: 18px;
    }

    .icon {
        width: 48px;
        height: 48px;
        font-size: 23px;
    }

    .card h2 {
        margin-top: 10px;
        font-size: 16px;
    }

    .card p {
        font-size: 10px;
    }
}


/* VERY SMALL PHONE */

@media (max-width: 360px) {

    .container {
        gap: 9px;
        padding: 10px;
    }

    .card {
        min-height: 140px;
        padding: 14px 5px;
    }

    .icon {
        width: 42px;
        height: 42px;
        font-size: 20px;
    }

    .card h2 {
        font-size: 14px;
    }

    .card p {
        font-size: 9px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .bg {
        display: none;
    }
}

</style>
</head>

<body>

    <!-- RAIN BACKGROUND (drops are created by the script at the bottom) -->

    <div class="bg"></div>


    <!-- HEADER -->

    <header>
        <h1>WELCOME</h1>
    </header>


    <!-- MAIN MENU -->

    <main class="container">

        <a href="DMKB/DMKB.HTML" class="card">
            <div class="icon">📚</div>
            <h2>DMKB</h2>
        </a>


        <a href="Game/Game.html" class="card">
            <div class="icon">🎮</div>
            <h2>Games</h2>
        </a>


        <a href="Entertainment/Entertainment.html" class="card">
            <div class="icon">🎬</div>
            <h2>Entertainment</h2>
        </a>


        <a href="apps/a.html" class="card">
            <div class="icon">⚡</div>
            <h2>Apps Hub</h2>
        </a>


        <a href="association/a.html" class="card">
            <div class="icon">🏛️</div>
            <h2>Association</h2>
        </a>

    </main>


    <!-- FOOTER -->

    <footer>
        <p>© Ghost Hunter • All Rights Reserved</p>
    </footer>


    <!-- RAIN SCRIPT -->

    <script>
        var bg = document.querySelector('.bg');
        var DROPS = window.innerWidth < 600 ? 40 : 80;   // change this number for more/less rain

        for (var i = 0; i < DROPS; i++) {
            var d = document.createElement('span');
            var w = 1.5 + Math.random() * 2;             // width in px
            var h = 14 + Math.random() * 22;             // length in px
            var dur = 0.7 + Math.random() * 0.9;         // fall time in seconds (smaller = faster)

            d.style.left = Math.random() * 100 + '%';
            d.style.width = w + 'px';
            d.style.height = h + 'px';
            d.style.opacity = 0.35 + Math.random() * 0.5;
            d.style.animationDuration = dur + 's';
            d.style.animationDelay = (-Math.random() * 3) + 's';

            bg.appendChild(d);
        }
    </script>

</body>
</html>
